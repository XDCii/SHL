/* ── مولّد أسئلة الأشكال: خمسة أشكال معروضة والسادس هو المطلوب ── */
var RING=[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]];
var SCALES=[0.55,0.68,0.81,0.94,1.07,1.20];
var SHADE_FILL=['none','var(--pen)','var(--pen)'];
var SHADE_OP  =['0','0.32','1'];

function gridSVG(st,size){
  var s=size||58,g=(66-16)/3,p=8,o='';
  o+='<svg viewBox="0 0 66 66" width="'+s+'" height="'+s+'" xmlns="http://www.w3.org/2000/svg">';
  for(var r=0;r<3;r++)for(var c=0;c<3;c++){
    var on=(RING[st.pos][0]===r&&RING[st.pos][1]===c),x=p+c*g,y=p+r*g,w=g-2.5;
    o+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+w+'" rx="1" fill="var(--grid-empty)"/>';
    if(on)o+='<rect x="'+(x+1)+'" y="'+(y+1)+'" width="'+(w-2)+'" height="'+(w-2)+'" rx="1" fill="var(--pen)" fill-opacity="'+SHADE_OP[st.shade]+'" stroke="var(--pen)" stroke-width="1.8"/>';
  }
  for(var d=0;d<st.count;d++)o+='<circle cx="'+(7+d*7)+'" cy="62" r="2.2" fill="var(--ink)"/>';
  return o+'</svg>';
}
function polyPts(n,r){
  var a=[],i,ang;
  for(i=0;i<n;i++){ang=i*2*Math.PI/n;
    a.push((r*Math.sin(ang)).toFixed(2)+','+(-r*Math.cos(ang)).toFixed(2));}
  return a.join(' ');
}
function figSVG(st,size){
  var s=size||58,sc=SCALES[st.size],r=18,m=st.mirror?-1:1,o='';
  var nx=(r*0.52*Math.sin(0.95)).toFixed(2),ny=(-r*0.52*Math.cos(0.95)).toFixed(2);
  o+='<svg viewBox="0 0 66 66" width="'+s+'" height="'+s+'" xmlns="http://www.w3.org/2000/svg">';
  o+='<g transform="translate(33,30) scale('+m+',1) rotate('+st.rot+') scale('+sc+')">';
  o+='<polygon points="'+polyPts(st.sides,r)+'" fill="var(--pen)" fill-opacity="'+SHADE_OP[st.shade]+
     '" stroke="var(--pen)" stroke-width="'+(2/sc).toFixed(2)+'" stroke-linejoin="round"/>';
  o+='<circle cx="'+nx+'" cy="'+ny+'" r="'+(3/sc).toFixed(2)+'" fill="'+(st.shade===2?'var(--card)':'var(--pen)')+'"/>';
  o+='</g>';
  for(var d=0;d<st.count;d++)o+='<circle cx="'+(7+d*7)+'" cy="62" r="2.2" fill="var(--ink)"/>';
  return o+'</svg>';
}
function drawFrame(kind,st,size){return kind==='grid'?gridSVG(st,size):figSVG(st,size);}

function rnd(n){return Math.floor(Math.random()*n);}
function pickSome(arr,k){var a=arr.slice(),out=[],i;
  for(i=0;i<k&&a.length;i++)out.push(a.splice(rnd(a.length),1)[0]);return out;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function makeInductive(){
  var kind=Math.random()<0.35?'grid':'figure';
  var attrs=kind==='grid'?['pos','count','shade']:['rot','size','count','shade','sides','mirror'];
  var vary=pickSome(attrs,2);
  var ar=[],en=[],rule={};
  var base={pos:rnd(8),count:2+rnd(3),shade:2,rot:45*rnd(8),size:3,sides:3+rnd(4),mirror:0};

  if(vary.indexOf('pos')>-1){
    var mode=['step','hold','split'][rnd(3)];
    if(mode==='step'){
      var so=[1,2,3,5,6,7],sp=so[rnd(so.length)];
      rule.pos=function(i){return (base.pos+sp*i)%8;};
      var pA={1:'خانة واحدة مع عقارب الساعة',2:'خانتين مع عقارب الساعة',3:'ثلاث خانات مع عقارب الساعة',
              5:'ثلاث خانات عكس عقارب الساعة',6:'خانتين عكس عقارب الساعة',7:'خانة واحدة عكس عقارب الساعة'}[sp];
      var pE={1:'one cell clockwise',2:'two cells clockwise',3:'three cells clockwise',
              5:'three cells anticlockwise',6:'two cells anticlockwise',7:'one cell anticlockwise'}[sp];
      ar.push('المربع المظلّل يتقدّم '+pA+' في كل خطوة');
      en.push('the marked cell advances '+pE+' each step');
    } else if(mode==='hold'){
      var hd=Math.random()<0.5?1:7;
      rule.pos=function(i){return (base.pos+hd*Math.floor(i/2))%8;};
      ar.push('المربع المظلّل يثبت صورتين ثم يتحرّك خانة '+(hd===1?'مع':'عكس')+' عقارب الساعة');
      en.push('the marked cell holds for two figures, then moves one cell '+(hd===1?'clockwise':'anticlockwise'));
    } else {
      var a0=rnd(8),b0=(a0+3+rnd(3))%8,sa=Math.random()<0.5?1:7,sb=Math.random()<0.5?1:7;
      rule.pos=function(i){return i%2===0?(a0+sa*(i/2))%8:(b0+sb*((i-1)/2))%8;};
      ar.push('الصور الفردية تتبع تسلسلًا والصور الزوجية تتبع تسلسلًا آخر مستقلًا عنه');
      en.push('the odd-numbered figures follow one sequence and the even-numbered ones follow a separate sequence');
    }
  }
  if(vary.indexOf('rot')>-1){
    var ro=[45,90,135,225,270,315],rd=ro[rnd(ro.length)];
    if(vary.indexOf('sides')===-1&&rd%(360/base.sides)===0)base.sides=(base.sides===4?5:3);
    rule.rot=function(i){return (base.rot+rd*i)%360;};
    var deg=rd>180?360-rd:rd;
    ar.push('الشكل يدور '+deg+' درجة '+(rd>180?'عكس':'مع')+' عقارب الساعة في كل خطوة');
    en.push('the figure turns '+deg+'\u00B0 '+(rd>180?'anticlockwise':'clockwise')+' each step');
  }
  if(vary.indexOf('size')>-1){
    var zd=Math.random()<0.5?1:-1,z0=zd>0?0:5;
    rule.size=function(i){return z0+zd*i;};
    ar.push(zd>0?'وحجم الشكل يكبر درجة في كل صورة':'وحجم الشكل يصغر درجة في كل صورة');
    en.push(zd>0?'the figure grows one step larger in each figure':'the figure shrinks one step in each figure');
  }
  if(vary.indexOf('count')>-1){
    if(Math.random()<0.5){
      var cd=Math.random()<0.5?1:-1,c0=cd>0?1:6;
      rule.count=function(i){return c0+cd*i;};
      ar.push(cd>0?'وعدد النقاط يزيد واحدة في كل صورة':'وعدد النقاط ينقص واحدة في كل صورة');
      en.push(cd>0?'the dot count rises by one in each figure':'the dot count falls by one in each figure');
    } else {
      var pr=pickSome([1,2,3,4,5],2),co=rnd(2);
      rule.count=function(i){return pr[(i+co)%2];};
      ar.push('وعدد النقاط يتبادل بين '+pr[0]+' و'+pr[1]+' صورةً بعد صورة');
      en.push('the dot count alternates between '+pr[0]+' and '+pr[1]+' from figure to figure');
    }
  }
  if(vary.indexOf('shade')>-1){
    if(Math.random()<0.5){
      var so2=rnd(2);
      rule.shade=function(i){return ((i+so2)%2===0)?2:0;};
      ar.push('والتظليل يتبادل بين ممتلئ وفارغ');
      en.push('the shading alternates between filled and empty');
    } else {
      var s3=rnd(3);
      rule.shade=function(i){return (i+s3)%3;};
      ar.push('والتظليل يدور على ثلاث حالات بالترتيب: فارغ ثم خفيف ثم ممتلئ ويعيد');
      en.push('the shading cycles through three states in order: empty, light, filled, then repeats');
    }
  }
  if(vary.indexOf('sides')>-1){
    if(Math.random()<0.5){
      var pp=pickSome([3,4,5,6],2),po=rnd(2);
      rule.sides=function(i){return pp[(i+po)%2];};
      ar.push('والشكل يتبادل بين '+SHNAME_AR[pp[0]]+' و'+SHNAME_AR[pp[1]]);
      en.push('the figure alternates between '+SHNAME_EN[pp[0]]+' and '+SHNAME_EN[pp[1]]);
    } else {
      var tp=pickSome([3,4,5,6],3),to=rnd(3);
      rule.sides=function(i){return tp[(i+to)%3];};
      ar.push('والشكل يدور على ثلاثة أشكال بالترتيب: '+SHNAME_AR[tp[0]]+' ثم '+SHNAME_AR[tp[1]]+' ثم '+SHNAME_AR[tp[2]]+' ويعيد');
      en.push('the figure cycles through three shapes in order: '+SHNAME_EN[tp[0]]+', '+SHNAME_EN[tp[1]]+', '+SHNAME_EN[tp[2]]+', then repeats');
    }
  }
  if(vary.indexOf('mirror')>-1){
    var mo=rnd(2);
    rule.mirror=function(i){return ((i+mo)%2===0)?0:1;};
    ar.push('والشكل ينعكس أفقيًا صورةً بعد صورة');
    en.push('the figure flips horizontally from figure to figure');
  }

  var KEYS=['pos','count','shade','rot','size','sides','mirror'];
  function stateAt(i){
    var st={};KEYS.forEach(function(k){st[k]=rule[k]?rule[k](i):base[k];});return st;
  }
  var frames=[stateAt(0),stateAt(1),stateAt(2),stateAt(3),stateAt(4)],right=stateAt(5);
  function key(st){return kind==='grid'
    ? st.pos+'|'+st.count+'|'+st.shade
    : st.rot+'|'+st.size+'|'+st.count+'|'+st.shade+'|'+st.sides+'|'+st.mirror;}

  function perturb(st,a){
    var c={};KEYS.forEach(function(k){c[k]=st[k];});
    if(a==='pos')   c.pos=(c.pos+(Math.random()<0.5?1:6))%8;
    if(a==='count') c.count=clamp(c.count>=4?c.count-1:c.count+1,1,6);
    if(a==='shade') c.shade=(c.shade+1+rnd(2))%3;
    if(a==='rot')   c.rot=(c.rot+(Math.random()<0.5?90:270))%360;
    if(a==='size')  c.size=clamp(c.size>=3?c.size-1:c.size+1,0,5);
    if(a==='sides') c.sides=clamp(c.sides>=5?c.sides-1:c.sides+1,3,6);
    if(a==='mirror')c.mirror=1-c.mirror;
    return c;
  }
  var seen={},opts=[right],order=pickSome(attrs,attrs.length),i,cand,guard=0;
  seen[key(right)]=1;
  for(i=0;i<order.length&&opts.length<4;i++){
    cand=perturb(right,order[i]);
    if(!seen[key(cand)]){seen[key(cand)]=1;opts.push(cand);}
  }
  while(opts.length<4&&guard<80){
    guard++;cand=perturb(opts[rnd(opts.length)],attrs[rnd(attrs.length)]);
    if(!seen[key(cand)]){seen[key(cand)]=1;opts.push(cand);}
  }
  var shuffled=opts.map(function(v,ix){return{v:v,r:Math.random(),correct:ix===0};})
                   .sort(function(a,b){return a.r-b.r;});

  return {kind:kind,frames:frames,opts:shuffled,
    sig:kind+'|'+frames.map(key).join('/')+'>'+key(right),
    ar:'قاعدتان مستقلتان: '+ar.join('، ')+'. تتبّع كل قاعدة وحدها عبر الصور الخمس قبل أن تنظر إلى الخيارات — الأولى عادة تستبعد خيارين، والثانية تحسم الباقي.',
    en:'Two independent rules: '+en.join(', ')+'. Track each rule on its own across the five figures before looking at the options — the first usually eliminates two, and the second settles the rest.'};
}
var SHNAME_AR={3:'مثلث',4:'مربع',5:'خماسي',6:'سداسي'};
var SHNAME_EN={3:'a triangle',4:'a square',5:'a pentagon',6:'a hexagon'};


/* ══════════ الواجهة ══════════ */
(function(){
  var lang='ar',sec='verbal',mode='review',state=null,timer=null;
  var runner=document.getElementById('runner'),setup=document.getElementById('setup');
  function t(){return T[lang];}
  function ex(it){return it[lang]||it.ar;}

  function paintChrome(){
    var L=t();
    document.documentElement.lang=lang;
    document.documentElement.dir=L.dir;
    document.getElementById('sig').innerHTML=L.sig;
    document.getElementById('langBtn').textContent=L.other;
    document.getElementById('themeBtn').textContent=L.theme;
    document.getElementById('tab-guide').textContent=L.tabGuide;
    document.getElementById('tab-train').textContent=L.tabTrain;
    document.getElementById('guideBody').innerHTML=GUIDE[lang];
    document.getElementById('footBody').innerHTML=L.foot;
    setup.innerHTML=
      '<h2>'+L.setupH+'</h2><p class="sec-note" style="margin:6px 0 0">'+L.setupNote+'</p>'+
      '<div class="field"><div class="lbl">'+L.lblSec+'</div><div class="chips" id="secChips">'+
      chip('data-sec','verbal',sec,L.secV,L.secVs)+chip('data-sec','numerical',sec,L.secN,L.secNs)+
      chip('data-sec','inductive',sec,L.secI,L.secIs)+'</div></div>'+
      '<div class="field"><div class="lbl">'+L.lblMode+'</div><div class="chips" id="modeChips">'+
      chip('data-mode','review',mode,L.mR,L.mRs)+chip('data-mode','exam',mode,L.mE,L.mEs)+'</div></div>'+
      '<button class="go" id="startBtn" type="button">'+L.start+'</button>';
    wireSetup();
  }
  function chip(attr,val,cur,label,sub){
    return '<button class="chip" '+attr+'="'+val+'" aria-pressed="'+(cur===val?'true':'false')+'">'+
           label+'<small>'+sub+'</small></button>';
  }
  function wireSetup(){
    ['secChips','modeChips'].forEach(function(id){
      var attr=id==='secChips'?'data-sec':'data-mode';
      document.getElementById(id).addEventListener('click',function(ev){
        var b=ev.target.closest('.chip');if(!b)return;
        Array.prototype.forEach.call(this.querySelectorAll('.chip'),function(c){
          c.setAttribute('aria-pressed',c===b?'true':'false');});
        if(attr==='data-sec')sec=b.getAttribute(attr);else mode=b.getAttribute(attr);
      });
    });
    document.getElementById('startBtn').addEventListener('click',begin);
  }

  document.getElementById('langBtn').addEventListener('click',function(){
    lang=lang==='ar'?'en':'ar';
    try{localStorage.setItem('shl-lang',lang);}catch(e){}
    if(timer){clearInterval(timer);timer=null;}
    state=null;runner.hidden=true;runner.innerHTML='';setup.hidden=false;
    paintChrome();
  });
  (function(){
    var b=document.getElementById('themeBtn'),cur=null;
    try{var s=localStorage.getItem('shl-theme');if(s){cur=s;document.documentElement.setAttribute('data-theme',s);}}catch(e){}
    b.addEventListener('click',function(){
      if(!cur)cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'light':'dark';
      else cur=cur==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',cur);
      try{localStorage.setItem('shl-theme',cur);}catch(e){}
    });
  })();
  var tabs=[['tab-guide','p-guide'],['tab-train','p-train']];
  tabs.forEach(function(tb){
    document.getElementById(tb[0]).addEventListener('click',function(){
      tabs.forEach(function(o){
        var on=o[0]===tb[0];
        document.getElementById(o[0]).setAttribute('aria-selected',on?'true':'false');
        document.getElementById(o[1]).classList.toggle('on',on);
      });
      window.scrollTo(0,0);
    });
  });

  function shuffle(a){var r=a.slice(),i,j,t;
    for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}

  function build(){
    var items=[],full=(mode==='review');
    if(sec==='verbal'){
      var pool=full?VERBAL:shuffle(VERBAL).slice(0,10);
      pool.forEach(function(bk,bi){bk.s.forEach(function(st){
        items.push({type:'v',passage:bk.p,pIdx:bi,stem:st.t,
          ch:["True","False","Can't Say"],a:{T:0,F:1,CS:2}[st.a],ar:st.ar,en:st.en});});});
    } else if(sec==='numerical'){
      var qs=full?NUM:shuffle(NUM).slice(0,17);
      items=qs.map(function(q){
        var order=shuffle(q.ch.map(function(c,i){return i;}));
        return {type:'n',stem:q.stem,tbl:q.tbl,
          ch:order.map(function(i){return q.ch[i];}),
          a:order.indexOf(q.a),ar:q.ar,en:q.en};
      });
    } else {
      var want=full?16:24,used={},guard=0;
      while(items.length<want&&guard<800){
        guard++;
        var g=makeInductive();
        if(used[g.sig])continue;
        used[g.sig]=1;
        items.push({type:'i',kind:g.kind,frames:g.frames,opts:g.opts,ar:g.ar,en:g.en});
      }
    }
    var mins={verbal:17,numerical:18,inductive:24}[sec];
    return {items:items,idx:0,ans:new Array(items.length).fill(null),left:mins*60,done:false};
  }

  function qBody(it,showAns,picked,hidePassage){
    var h='';
    if(it.type==='v'){
      if(!hidePassage)h+='<div class="passage">'+it.passage+'</div>';
      h+='<p class="stem ltr">'+it.stem+'</p>';
    } else if(it.type==='n'){
      if(it.tbl){h+='<div class="dtbl"><table><tbody>';
        it.tbl.forEach(function(r,ri){h+='<tr>'+r.map(function(c){
          return ri===0?'<th>'+c+'</th>':'<td>'+c+'</td>';}).join('')+'</tr>';});
        h+='</tbody></table></div>';}
      h+='<p class="stem ltr">'+it.stem+'</p>';
    } else {
      h+='<div class="seqrow">';
      it.frames.forEach(function(f){h+='<span class="frame">'+drawFrame(it.kind,f,58)+'</span>';});
      h+='<span class="frame miss">?</span></div><p class="stem">'+t().seqQ+'</p>';
    }
    if(it.type==='i'){
      h+='<div class="choices grid">';
      it.opts.forEach(function(o,i){
        var cls='ch svgch';
        if(showAns){if(o.correct)cls+=' correct';else if(picked===i)cls+=' incorrect';}
        h+='<button class="'+cls+'" data-i="'+i+'" type="button" aria-pressed="'+(picked===i?'true':'false')+'">'+drawFrame(it.kind,o.v,58)+'</button>';
      });
      h+='</div>';
    } else {
      h+='<div class="choices">';
      it.ch.forEach(function(c,i){
        var cls='ch';
        if(showAns){if(i===it.a)cls+=' correct';else if(picked===i)cls+=' incorrect';}
        h+='<button class="'+cls+'" data-i="'+i+'" type="button" aria-pressed="'+(picked===i?'true':'false')+'" dir="ltr" style="text-align:left">'+c+'</button>';
      });
      h+='</div>';
    }
    return h;
  }
  function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}

  function render(){
    var s=state,L=t(),h='';
    if(mode==='review'){
      h+='<div class="runbar"><span>'+L.reviewBar(s.items.length)+'</span>'+
         '<button class="ghost" id="backBtn" type="button">'+L.changeSec+'</button></div>';
      s.items.forEach(function(it,i){
        h+='<div class="q" data-q="'+i+'"><div class="num">'+L.qOf(i+1,s.items.length)+'</div>';
        h+=qBody(it,false,s.ans[i],it.pIdx!==undefined&&i>0&&s.items[i-1].pIdx===it.pIdx);
        h+='<details class="rev"><summary>'+L.showAns+'</summary><div class="expl"><b>'+L.explain+'</b>'+ex(it)+'</div></details></div>';
      });
    } else if(!s.done){
      var it=s.items[s.idx];
      h+='<div class="runbar"><span>'+L.qOf(s.idx+1,s.items.length)+'</span>'+
         '<span class="clock'+(s.left<60?' low':'')+'" id="clk">'+fmt(s.left)+'</span></div>'+
         '<div class="prog"><i style="width:'+(s.idx/s.items.length*100)+'%"></i></div>'+
         '<div class="q" data-q="'+s.idx+'">'+qBody(it,false,s.ans[s.idx])+'</div>'+
         '<div class="navrow"><button id="prevBtn" type="button"'+(s.idx===0?' disabled':'')+'>'+L.prev+'</button>'+
         '<button id="nextBtn" class="primary" type="button">'+(s.idx===s.items.length-1?L.finish:L.next)+'</button></div>';
    } else {
      var right=0;
      s.items.forEach(function(it,i){if(isRight(it,s.ans[i]))right++;});
      var pct=Math.round(right/s.items.length*100);
      h+='<div class="result"><div class="big">'+right+' / '+s.items.length+'</div>'+
         '<div class="sub">'+L.pctRight(pct)+'</div>'+
         '<div class="bar"><i style="flex:'+right+';background:var(--ok)"></i><i style="flex:'+(s.items.length-right)+';background:var(--rule-soft)"></i></div>'+
         '<div class="sub">'+L.resNote+'</div></div>';
      if(sec==='verbal'){
        var lab=["True","False","Can't Say"],hit=[0,0,0],tot=[0,0,0];
        s.items.forEach(function(it,i){tot[it.a]++;if(isRight(it,s.ans[i]))hit[it.a]++;});
        h+='<div class="tbl-scroll"><table><thead><tr><th>'+L.byType+'</th><th></th></tr></thead><tbody>';
        lab.forEach(function(n,k){
          if(!tot[k])return;
          var pc=Math.round(hit[k]/tot[k]*100);
          h+='<tr><td><span class="mono">'+n+'</span></td><td>'+hit[k]+' / '+tot[k]+
             ' <span style="color:var(--muted)">('+pc+'%)</span></td></tr>';
        });
        h+='</tbody></table></div>';
      }
      h+='<div class="navrow"><button id="backBtn" type="button">'+L.again+'</button></div>';
      s.items.forEach(function(it,i){
        var ok=isRight(it,s.ans[i]);
        h+='<div class="q"><div class="num">'+L.qN(i+1)+'</div>'+qBody(it,true,s.ans[i])+
           '<div class="expl '+(ok?'good':'bad')+'"><b>'+(ok?L.good:(s.ans[i]===null?L.none:L.bad))+'</b>'+ex(it)+'</div></div>';
      });
    }
    runner.innerHTML=h;wire();
  }
  function isRight(it,a){
    if(a===null)return false;
    return it.type==='i'?!!it.opts[a].correct:(a===it.a);
  }

  function wire(){
    var s=state;
    Array.prototype.forEach.call(runner.querySelectorAll('.q'),function(qd){
      var qi=parseInt(qd.getAttribute('data-q'),10);if(isNaN(qi))return;
      Array.prototype.forEach.call(qd.querySelectorAll('.ch'),function(b){
        b.addEventListener('click',function(){
          if(mode==='exam'&&s.done)return;
          s.ans[qi]=parseInt(b.getAttribute('data-i'),10);
          Array.prototype.forEach.call(qd.querySelectorAll('.ch'),function(o){
            o.setAttribute('aria-pressed',o===b?'true':'false');});
          if(mode==='review'){
            var det=qd.querySelector('details.rev');if(det)det.open=true;
            var it=s.items[qi];
            Array.prototype.forEach.call(qd.querySelectorAll('.ch'),function(o,i){
              o.classList.remove('correct','incorrect');
              var r=it.type==='i'?it.opts[i].correct:(i===it.a);
              if(r)o.classList.add('correct');else if(i===s.ans[qi])o.classList.add('incorrect');
            });
          }
        });
      });
    });
    var pb=runner.querySelector('#prevBtn'),nb=runner.querySelector('#nextBtn'),bb=runner.querySelector('#backBtn');
    if(pb)pb.addEventListener('click',function(){if(s.idx>0){s.idx--;render();window.scrollTo(0,0);}});
    if(nb)nb.addEventListener('click',function(){
      if(s.idx<s.items.length-1){s.idx++;render();window.scrollTo(0,0);}else finish();});
    if(bb)bb.addEventListener('click',function(){
      if(timer){clearInterval(timer);timer=null;}
      runner.hidden=true;setup.hidden=false;window.scrollTo(0,0);});
  }
  function finish(){if(timer){clearInterval(timer);timer=null;}state.done=true;render();window.scrollTo(0,0);}

  function begin(){
    state=build();setup.hidden=true;runner.hidden=false;
    if(timer){clearInterval(timer);timer=null;}
    render();window.scrollTo(0,0);
    if(mode==='exam'){
      timer=setInterval(function(){
        state.left--;
        var c=runner.querySelector('#clk');
        if(c){c.textContent=fmt(state.left);c.classList.toggle('low',state.left<60);}
        if(state.left<=0)finish();
      },1000);
    }
  }

  try{var sl=localStorage.getItem('shl-lang');if(sl==='en'||sl==='ar')lang=sl;}catch(e){}
  paintChrome();
})();
</script>
</body>
</html>
