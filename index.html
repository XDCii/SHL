  s:[
   {t:"Drivers who book in advance pay less than those who do not.",a:"T",ar:"مذكور نصًّا: سعر الحجز المسبق أقل. True.",en:"Stated directly: the advance rate is lower. True."},
   {t:"The airport has published the share of spaces booked in advance.",a:"F",ar:"النص ينتهي بأن المطار لم ينشر نسبة الأماكن المحجوزة مسبقًا. العبارة تثبت النشر فتناقضه. False. ولاحظ أن عدم النشر لا يعني عدم وجود الرقم، لكنه يكفي لنفي هذه العبارة تحديدًا.",en:"The passage closes by saying the airport has not published the proportion of spaces booked ahead. The statement asserts publication and so contradicts it. False. Note that withholding a figure does not mean it does not exist, but it is enough to falsify this particular statement."},
   {t:"The booking system caused the rise in long-stay occupancy.",a:"CS",ar:"الارتفاع مذكور، لكن النص لا ينسبه للنظام. Can't Say.",en:"The rise is stated, but the passage does not attribute it to the system. Can't Say."}
  ]},
 {p:"A textile factory moved from one shift to two. Monthly output nearly doubled, but the defect rate on the night shift is higher than on the day shift. Supervisors on the night shift have less experience on average. The factory applies the same quality inspection procedure on both shifts.",
  s:[
   {t:"The inspection procedure differs between the two shifts.",a:"F",ar:"النص يقول إن الإجراء نفسه مطبّق على الورديتين. False.",en:"The passage says the same procedure applies on both shifts. False."},
   {t:"Night-shift supervisors are on average less experienced.",a:"T",ar:"النص يقولها صراحة، ومعها لفظ on average الذي يجعلها وصفًا للمتوسط لا لكل مشرف. العبارة نقلت القيد نفسه، فلم تتجاوز النص. True.",en:"The passage says so explicitly, with \"on average\" making it a claim about the mean rather than about every supervisor. The statement carries the same qualifier, so it does not overreach. True."},
   {t:"The supervisors' inexperience explains the higher defect rate.",a:"CS",ar:"النص يذكر الأمرين جنبًا إلى جنب دون أن يجعل أحدهما سببًا للآخر. Can't Say.",en:"The passage sets the two facts side by side without making one the cause of the other. Can't Say."}
  ]},
 {p:"A hospital introduced text-message reminders for outpatient appointments. Missed appointments fell over the following six months. The reminders are sent two days before the appointment. Patients without a registered mobile number continue to receive letters.",
  s:[
   {t:"Reminders are sent on the day of the appointment.",a:"F",ar:"النص يحدّد أن التذكير يُرسل قبل الموعد بيومين. تحديد وقت مختلف يناقض التحديد المذكور. False.",en:"The passage specifies that reminders go out two days before the appointment. Naming a different timing contradicts the figure given. False."},
   {t:"Some patients still receive reminders by letter.",a:"T",ar:"من ليس لديهم رقم مسجّل يستمرّون في تلقّي الرسائل البريدية. True.",en:"Patients with no registered mobile number continue to receive letters. True."},
   {t:"Text reminders are more effective than letters.",a:"CS",ar:"لا مقارنة في النص بين فعالية الوسيلتين. Can't Say.",en:"The passage makes no comparison between the effectiveness of the two channels. Can't Say."}
  ]},
 {p:"A city introduced a bus lane on its busiest corridor. Average bus journey times fell by 11 minutes. Journey times for private cars on the same corridor rose slightly. Ridership on the route increased over the following year, although fares were also reduced during that period.",
  s:[
   {t:"Bus journey times improved on the corridor.",a:"T",ar:"انخفاض 11 دقيقة تحسّن مذكور نصًّا. True.",en:"A fall of 11 minutes is an improvement stated directly. True."},
   {t:"Journey times for private cars also improved.",a:"F",ar:"النص يقول إن أزمنة السيارات الخاصة ارتفعت قليلًا على المسار نفسه. الارتفاع عكس التحسّن، فالعبارة مناقضة. False — ولاحظ أن lightly لا تلغي الاتجاه.",en:"The passage says journey times for private cars rose slightly on the same corridor. A rise is the opposite of an improvement, so the statement is contradicted. False — and \"slightly\" does not reverse the direction."},
   {t:"The bus lane was responsible for the rise in ridership.",a:"CS",ar:"الأجرة خُفّضت في الفترة نفسها، فالسبب غير محسوم في النص. Can't Say.",en:"Fares were cut in the same period, so the passage does not settle the cause. Can't Say."}
  ]},
 {p:"A firm moved from quarterly software releases to monthly ones. The number of defects found by customers per release fell, although the total across the year was broadly unchanged. Support staff report that smaller releases are easier to roll back.",
  s:[
   {t:"The number of defects found per release fell.",a:"T",ar:"النص يفصل بين رقمين: العيوب لكل إصدار انخفضت، والإجمالي السنوي بقي كما هو. العبارة تخصّ الرقم الأول وقد ذُكر صراحة. True.",en:"The passage separates two figures: defects per release fell, while the annual total stayed broadly the same. The statement concerns the first figure, which is stated outright. True."},
   {t:"The total number of defects across the year fell.",a:"F",ar:"النص يقول إن الإجمالي بقي دون تغيّر يُذكر. انخفاض المعدّل لكل إصدار لا يعني انخفاض الإجمالي، لأن عدد الإصدارات زاد. False.",en:"The passage says the annual total was broadly unchanged. A fall per release does not mean a fall in the total, since the number of releases rose. False."},
   {t:"Customers prefer the monthly release schedule.",a:"CS",ar:"النص ينقل رأي فريق الدعم لا رأي العملاء. Can't Say.",en:"The passage relays the support team's view, not the customers'. Can't Say."}
  ]},
 {p:"A farm replaced flood irrigation with drip irrigation on half its land. Water use on that land fell by about 40%. Yields on the drip-irrigated land were slightly higher than on the rest. The initial cost of the system was met partly by a government grant.",
  s:[
   {t:"Water use fell on the land that was converted.",a:"T",ar:"مذكور نصًّا: انخفض نحو 40% على تلك الأرض. True.",en:"Stated directly: it fell by about 40% on that land. True."},
   {t:"The farm met the entire cost of the drip system itself.",a:"F",ar:"النص يذكر أن منحة حكومية غطّت جزءًا من التكلفة. False.",en:"The passage says a government grant covered part of the cost. False."},
   {t:"Drip irrigation will be extended to the remaining land.",a:"CS",ar:"النص يصف ما جرى على نصف الأرض ولا يتطرّق لأي نية مستقبلية. غياب النية ليس نفيًا لها، ولذلك الجواب Can't Say لا False.",en:"The passage describes what was done on half the land and says nothing about any future intention. The absence of a stated plan is not a denial of one, which is why this is Can't Say rather than False."}
  ]},
 {p:"An insurer began settling small motor claims through an app rather than by telephone. Average settlement time fell from nine days to four. Complaints about settlement amounts were unchanged. Claims above a set value continue to be handled by an assessor.",
  s:[
   {t:"Average settlement time more than halved.",a:"T",ar:"نصف التسعة هو 4.5، والزمن الجديد 4 أيام أي أقل من النصف. حساب دقيق داخل النص. True.",en:"Half of nine is 4.5, and the new time is four days — less than half. A precise calculation inside the text. True."},
   {t:"All motor claims are now settled through the app.",a:"F",ar:"النص يستثني المطالبات فوق قيمة معيّنة. لفظ «كل» نادرًا ما يصمد. False.",en:"The passage excludes claims above a set value. Absolutes rarely survive. False."},
   {t:"Customers are more satisfied with the app than with the telephone service.",a:"CS",ar:"الشكاوى عن المبالغ لم تتغيّر، وهذا لا يقيس الرضا عن الوسيلة. Can't Say.",en:"Complaints about amounts were unchanged, which does not measure satisfaction with the channel. Can't Say."}
  ]},
 {p:"A cement plant replaced part of its fuel mix with processed waste. Carbon emissions per tonne of cement fell. Total emissions from the plant rose, because output increased over the same period. The plant reports both figures in its annual disclosure.",
  s:[
   {t:"Emissions per tonne of cement decreased.",a:"T",ar:"النص يذكر رقمين متعاكسين: الانبعاثات لكل طن انخفضت، والإجمالي ارتفع. العبارة تخصّ الكثافة لا الإجمالي، وهي مذكورة نصًّا. True.",en:"The passage gives two figures that move in opposite directions: emissions per tonne fell while the total rose. The statement concerns intensity rather than the total, and is stated directly. True."},
   {t:"Total emissions from the plant decreased.",a:"F",ar:"النص يقول إن الإجمالي ارتفع بسبب زيادة الإنتاج. انخفاض الكثافة لا يعني انخفاض الإجمالي، وهذا التمييز يتكرر كثيرًا. False.",en:"The passage says the total rose because output increased. A fall in intensity is not a fall in the total — a distinction that recurs often. False."},
   {t:"Output would have risen even without the change in fuel mix.",a:"CS",ar:"سؤال افتراضي لا يتناوله النص. Can't Say.",en:"A hypothetical the passage does not address. Can't Say."}
  ]},
 {p:"A bank offered optional English classes to branch staff. Attendance was highest among staff with fewer than three years' service. Staff who completed the course were no more likely to be promoted in the following year than those who did not. The bank intends to run the course again.",
  s:[
   {t:"The course was compulsory for branch staff.",a:"F",ar:"النص يصف الدروس بأنها optional، أي اختيارية. الإلزام يناقض الوصف صراحة. False.",en:"The passage describes the classes as optional. Compulsory attendance contradicts that description outright. False."},
   {t:"The bank plans to run the course again.",a:"T",ar:"النص ينتهي بأن البنك ينوي إعادة الدورة. النية مذكورة صراحة، والعبارة نقلتها كنيّة لا كحدث واقع، فلم تتجاوز النص. True.",en:"The passage ends by saying the bank intends to run the course again. The intention is stated explicitly, and the statement reports it as an intention rather than an accomplished fact, so it does not overreach. True."},
   {t:"Longer-serving staff found the course too basic.",a:"CS",ar:"النص يذكر ضعف حضورهم لا سببه. تفسير الضعف استنتاج من خارج النص. Can't Say.",en:"The passage reports their lower attendance, not the reason for it. Explaining it is an inference from outside the text. Can't Say."}
  ]},
 {p:"A retailer automated picking in one of its four warehouses. Orders processed per hour at that site rose by a third. Headcount at the site fell, with affected staff offered roles at the other three warehouses. Error rates at the automated site are similar to those at the manual sites.",
  s:[
   {t:"Automation was introduced at all four warehouses.",a:"F",ar:"النص يحدّد مستودعًا واحدًا من أربعة. False.",en:"The passage specifies one warehouse out of four. False."},
   {t:"Staff whose roles ended were offered work elsewhere in the company.",a:"T",ar:"مذكور نصًّا: عُرضت عليهم أدوار في المستودعات الثلاثة الأخرى. True.",en:"Stated directly: they were offered roles at the other three warehouses. True."},
   {t:"The automated site is more profitable than the manual sites.",a:"CS",ar:"النص يعطي الإنتاجية ومعدّل الأخطاء لا الربحية. Can't Say.",en:"The passage gives throughput and error rates, not profitability. Can't Say."}
  ]},
 {p:"A school introduced weekly practice tests in mathematics. Average results in the end-of-year examination rose compared with the previous cohort. Attendance was unchanged. The school also replaced two mathematics teachers during the same year.",
  s:[
   {t:"Average mathematics results improved on the previous cohort.",a:"T",ar:"النص يقارن صراحة بالدفعة السابقة ويقول إن المتوسط ارتفع. المقارنة موجودة في النص فلا تحتاج افتراضًا. True.",en:"The passage compares explicitly with the previous cohort and says the average rose. The comparison is in the text, so nothing has to be assumed. True."},
   {t:"Attendance declined during the year.",a:"F",ar:"النص يقول إن الحضور لم يتغيّر. الثبات ينفي الانخفاض، فالجواب False لا Can't Say — الفرق أن النص تناول الحضور فعلًا.",en:"The passage says attendance was unchanged. Stability rules out a decline, so this is False rather than Can't Say — the difference being that the passage does address attendance."},
   {t:"The practice tests caused the improvement in results.",a:"CS",ar:"تبديل معلّمين حدث في السنة نفسها، فالنص لا يعزل أثر الاختبارات. Can't Say.",en:"Two teachers were replaced in the same year, so the passage does not isolate the effect of the tests. Can't Say."}
  ]},
 {p:"A data centre raised its operating temperature by two degrees. Cooling costs fell by 8%. Hardware failure rates over the following year were within the range recorded in previous years. The manufacturer's warranty permits operation at the higher temperature.",
  s:[
   {t:"Cooling costs decreased after the change.",a:"T",ar:"النص يعطي رقمًا محدّدًا: انخفاض 8% في تكاليف التبريد بعد رفع الحرارة درجتين. العبارة أعمّ من الرقم لكنها متسقة معه. True.",en:"The passage gives a specific figure: cooling costs fell 8% after the two-degree rise. The statement is broader than the figure but consistent with it. True."},
   {t:"Operating at the higher temperature voids the manufacturer's warranty.",a:"F",ar:"النص يقول إن الضمان يسمح بالتشغيل عند الحرارة الأعلى. إبطال الضمان يناقض هذا السماح مباشرة. False.",en:"The passage says the warranty permits operation at the higher temperature. Voiding the warranty contradicts that permission directly. False."},
   {t:"The higher temperature has no effect on hardware life.",a:"CS",ar:"سنة واحدة ضمن المدى المعتاد لا تثبت انتفاء الأثر. النص يعطي ملاحظة لا نفيًا. Can't Say.",en:"One year within the usual range does not establish an absence of effect. The passage offers an observation, not a denial. Can't Say."}
  ]},
 {p:"A freelance platform introduced a verified-identity badge. Freelancers holding the badge receive more invitations to bid than those without it. Verification requires submitting an official document and takes about three days. The platform charges no fee for verification.",
  s:[
   {t:"Verification is free of charge.",a:"T",ar:"مذكور نصًّا: لا تفرض المنصة رسومًا. True.",en:"Stated directly: the platform charges no fee. True."},
   {t:"Verification is completed within a few hours.",a:"F",ar:"النص يحدّد نحو ثلاثة أيام. الساعات تناقض الأيام تناقضًا صريحًا في الرقم نفسه. False.",en:"The passage specifies about three days. Hours contradict days directly on the same figure. False."},
   {t:"Badged freelancers earn more than unbadged ones.",a:"CS",ar:"عدد الدعوات أكثر، لكن الدخل شيء آخر لم يذكره النص. Can't Say.",en:"They receive more invitations, but earnings are a separate matter the passage does not address. Can't Say."}
  ]},
 {p:"A coastal town built a sea wall along one stretch of its shoreline. Flooding of properties behind the wall stopped. Erosion further along the coast, beyond the wall, has increased since it was built. Engineers disagree about whether the wall is responsible.",
  s:[
   {t:"Properties behind the wall no longer flood.",a:"T",ar:"النص يقول إن فيضان العقارات خلف الجدار توقّف. العبارة إعادة صياغة لهذا التوقّف. True — والقيد «خلف الجدار» موجود في العبارة كما في النص.",en:"The passage says flooding of the properties behind the wall stopped. The statement restates that. True — and the qualifier \"behind the wall\" appears in both."},
   {t:"Engineers agree that the wall caused the increased erosion.",a:"F",ar:"النص يقول إن المهندسين مختلفون في المسألة. الاتفاق يناقض الاختلاف صراحة، فالجواب False. لكن انتبه: نسبة التعرية للجدار نفسها Can't Say لأن النص لم يحسمها.",en:"The passage says engineers disagree on the point. Agreement contradicts disagreement outright, so False. But note the distinction: attributing the erosion to the wall is itself Can't Say, since the passage does not settle it."},
   {t:"The wall caused the increased erosion beyond it.",a:"CS",ar:"المسألة محلّ خلاف بين المختصين، والنص ينقل الخلاف دون ترجيح. Can't Say.",en:"The point is disputed among specialists, and the passage reports the dispute without settling it. Can't Say."}
  ]},
 {p:"A study followed adults who moved their bedtime an hour earlier for eight weeks. Reported daytime alertness improved. Total sleep duration was unchanged, since participants also woke earlier. The researchers note that participants knew what the study was investigating.",
  s:[
   {t:"Total sleep duration increased during the study.",a:"F",ar:"النص يقول إن مدة النوم الكلية لم تتغيّر، لأن المشاركين استيقظوا مبكرًا أيضًا. تقديم النوم ساعة لا يعني إطالته. False.",en:"The passage says total duration was unchanged, since participants also woke earlier. Going to bed an hour earlier did not lengthen it. False."},
   {t:"Participants knew what the study was investigating.",a:"T",ar:"مذكور في آخر النص كملاحظة من الباحثين أنفسهم. True.",en:"Stated at the end of the passage as a note from the researchers themselves. True."},
   {t:"The earlier bedtime caused the improvement in alertness.",a:"CS",ar:"التحسّن مذكور، لكن معرفة المشاركين بهدف الدراسة تفتح تفسيرًا آخر، والنص لا يرجّح أيًّا منهما. Can't Say.",en:"The improvement is stated, but participants' awareness of the study's purpose opens another explanation, and the passage favours neither. Can't Say."}
  ]},
 {p:"A vaccine requires storage between two and eight degrees. A clinic recorded three departures from that range last year, each lasting under an hour. The manufacturer's guidance permits brief departures without discarding stock. The clinic discarded the affected doses regardless.",
  s:[
   {t:"The clinic kept the doses affected by the temperature departures.",a:"F",ar:"النص يقول إنها أتلفت الجرعات المتأثرة رغم سماح الشركة المصنّعة. False.",en:"The passage says the clinic discarded the affected doses despite the manufacturer's allowance. False."},
   {t:"The manufacturer's guidance allows brief departures without discarding stock.",a:"T",ar:"منصوص عليه حرفيًا في النص. True. ولاحظ أنه لا يتعارض مع تصرّف العيادة المخالف له.",en:"Stated in those terms in the passage. True. Note that it does not conflict with the clinic acting more strictly than it."},
   {t:"Other clinics follow the same practice as this one.",a:"CS",ar:"النص يتحدث عن عيادة واحدة ولا يذكر غيرها. Can't Say.",en:"The passage concerns a single clinic and mentions no others. Can't Say."}
  ]},
 {p:"A regional health authority introduced a review step before antibiotics could be prescribed for minor infections. Prescriptions fell by 18% in the first year. Patient complaints about waiting times rose. The authority has not reported whether infection rates changed.",
  s:[
   {t:"Antibiotic prescriptions declined in the first year.",a:"T",ar:"النص يعطي رقمًا محدّدًا: انخفاض 18%. True.",en:"The passage gives a specific figure: a fall of 18%. True."},
   {t:"The authority reported a change in infection rates.",a:"F",ar:"النص يقول صراحة إنها لم تُبلّغ عن ذلك. False.",en:"The passage states explicitly that it has not reported this. False."},
   {t:"The review step harmed patient outcomes.",a:"CS",ar:"ارتفاع الشكاوى عن الانتظار لا يقيس النتائج الصحية، ونتائج العدوى غير معلومة أصلًا. Can't Say.",en:"A rise in complaints about waiting does not measure clinical outcomes, and infection rates are unreported. Can't Say."}
  ]},
 {p:"An index fund tracks a basket of shares rather than selecting them individually. Its management fee is lower than that of actively managed funds. Over the last decade, most actively managed funds in the same category did not outperform their index. Past performance does not guarantee future results.",
  s:[
   {t:"Index funds charge a lower management fee than actively managed funds.",a:"T",ar:"منصوص عليه في النص كمقارنة صريحة. True.",en:"Stated in the passage as an explicit comparison. True."},
   {t:"Every actively managed fund failed to beat its index over the decade.",a:"F",ar:"النص يقول «most» أي معظمها لا كلها. تحويل «معظم» إلى «كل» مناقضة للنص. False.",en:"The passage says most, not all. Turning \"most\" into \"every\" contradicts it. False."},
   {t:"Index funds will outperform actively managed funds over the next decade.",a:"CS",ar:"النص يختم بأن الأداء السابق لا يضمن اللاحق، فهو يمنع هذا الاستنتاج صراحة دون أن ينفي وقوعه. Can't Say.",en:"The passage closes by saying past performance does not guarantee future results, which blocks the inference without denying the outcome. Can't Say."}
  ]},
 {p:"When the market price of a bond falls, its yield rises, because the fixed coupon represents a larger share of the lower price. A fund reported that the market value of its bond holdings declined last quarter. The fund did not sell any of the holdings. Coupon payments continued as scheduled.",
  s:[
   {t:"The yield on the fund's bond holdings rose as their price fell.",a:"T",ar:"النص يقرّر القاعدة العامة في جملته الأولى ثم يخبر أن السعر انخفض، فتطبيق القاعدة على الحالة لزوم مباشر. True.",en:"The passage states the general rule in its first sentence and then reports the price fall, so applying the rule to this case follows directly. True."},
   {t:"The fund sold part of its bond holdings during the quarter.",a:"F",ar:"النص يقول صراحة إن الصندوق لم يبع أيًّا من حيازاته. العبارة تثبت البيع فتناقضه. False — وهذه التفصيلة هي مفتاح العبارة الثالثة أيضًا.",en:"The passage states plainly that the fund sold none of its holdings. The statement asserts a sale and so contradicts it. False — and this detail is also the key to the third statement."},
   {t:"The fund made a loss over the quarter.",a:"CS",ar:"انخفاض القيمة السوقية بلا بيع لا يعني خسارة محقّقة، والنص لا يذكر النتيجة الكلية للصندوق. Can't Say.",en:"A fall in market value with no sale is not a realised loss, and the passage gives no overall result for the fund. Can't Say."}
  ]},
 {p:"A region raised its minimum wage by 9%. Employment in the hospitality sector was broadly unchanged in the following year. Average hours worked per employee fell slightly. Business groups had predicted job losses; unions had predicted none.",
  s:[
   {t:"Employment in hospitality fell sharply after the rise.",a:"F",ar:"النص يقول إن التوظيف بقي دون تغيّر يُذكر. False.",en:"The passage says employment was broadly unchanged. False."},
   {t:"Average hours worked per employee declined.",a:"T",ar:"مذكور نصًّا مع قيد «قليلًا»، والعبارة نقلت الاتجاه نفسه. True.",en:"Stated in the passage with the qualifier \"slightly\", and the statement reports the same direction. True."},
   {t:"The wage rise was responsible for the fall in average hours.",a:"CS",ar:"النص يذكر الأمرين متتاليين دون أن ينسب أحدهما للآخر. Can't Say.",en:"The passage reports the two facts in sequence without attributing one to the other. Can't Say."}
  ]},
 {p:"A fishing authority set a lower catch quota for one species. Landings of that species fell accordingly. Landings of a second, unregulated species rose over the same period. The authority monitors both species but regulates only the first.",
  s:[
   {t:"The authority regulates both species.",a:"F",ar:"النص يفرّق بين المراقبة والتنظيم: يراقب النوعين وينظّم الأول فقط. False.",en:"The passage distinguishes monitoring from regulating: it monitors both and regulates only the first. False."},
   {t:"Landings of the regulated species declined.",a:"T",ar:"مذكور نصًّا كنتيجة لخفض الحصة. True.",en:"Stated directly as a consequence of the lower quota. True."},
   {t:"Fishermen turned to the second species because of the quota.",a:"CS",ar:"الارتفاع مذكور والسبب غير مذكور. الربط بينهما معقول لكنه استنتاج من خارج النص. Can't Say.",en:"The rise is stated and the reason is not. Linking them is plausible but is an inference from outside the text. Can't Say."}
  ]},
 {p:"A laboratory produced a ceramic coating that resists temperatures above 1,400 degrees. In testing, coated components lasted longer than uncoated ones under identical conditions. The coating adds weight to the component. It has not yet been tested outside the laboratory.",
  s:[
   {t:"Coated components lasted longer than uncoated ones in testing.",a:"T",ar:"مذكور نصًّا مع قيد «تحت ظروف متطابقة». True.",en:"Stated directly, with the qualifier \"under identical conditions\". True."},
   {t:"The coating has been tested in field conditions.",a:"F",ar:"النص يقول إنه لم يُختبر بعد خارج المختبر. False.",en:"The passage says it has not yet been tested outside the laboratory. False."},
   {t:"The coating will be adopted commercially.",a:"CS",ar:"لا ذكر لأي خطة تسويق أو تبنٍّ. Can't Say.",en:"No commercial plan or adoption is mentioned. Can't Say."}
  ]},
 {p:"In a trial, one group received a new drug and another received a placebo. Neither the participants nor the staff administering the treatment knew which group was which. Symptom scores improved in both groups, though more in the drug group. The trial ran for twelve weeks.",
  s:[
   {t:"The staff administering the treatment knew who received the drug.",a:"F",ar:"النص ينفي علم الطرفين: المشاركين والطاقم. False.",en:"The passage denies knowledge on both sides: participants and staff. False."},
   {t:"Symptom scores improved in the placebo group as well.",a:"T",ar:"النص يقول إن التحسّن حدث في المجموعتين، وإن كان أكبر في مجموعة الدواء. True.",en:"The passage says improvement occurred in both groups, though it was greater in the drug group. True."},
   {t:"The drug is safe for long-term use.",a:"CS",ar:"التجربة استمرّت اثني عشر أسبوعًا ولا تتناول الأمان بعيد المدى. Can't Say.",en:"The trial ran twelve weeks and does not address long-term safety. Can't Say."}
  ]},
 {p:"A city restricted older diesel vehicles from its centre. Measured nitrogen dioxide at roadside monitors inside the zone fell. Levels at monitors outside the zone were unchanged. Traffic volumes inside the zone fell as well, and a new tram line opened in the same year.",
  s:[
   {t:"Nitrogen dioxide fell at roadside monitors inside the zone.",a:"T",ar:"النص يحدّد موضع القياس: محطات الرصد على جانب الطريق داخل النطاق، وهناك انخفض. العبارة نقلت القيد نفسه فلم تتجاوز النص. True.",en:"The passage specifies where the fall was measured: roadside monitors inside the zone. The statement carries the same qualifier, so it does not overreach. True."},
   {t:"Levels outside the zone fell as well.",a:"F",ar:"النص يقول إن مستويات المحطات خارج النطاق لم تتغيّر. الثبات ينفي الانخفاض، والنص تناول هذه المحطات فعلًا فالجواب False لا Can't Say.",en:"The passage says levels at monitors outside the zone were unchanged. Stability rules out a fall, and since the passage does address those monitors the answer is False, not Can't Say."},
   {t:"The vehicle restriction on its own caused the fall inside the zone.",a:"CS",ar:"خط ترام جديد افتُتح في السنة نفسها وحجم المرور انخفض أيضًا، فالنص لا يعزل أثر القيد وحده. Can't Say.",en:"A new tram line opened in the same year and traffic volumes also fell, so the passage does not isolate the restriction on its own. Can't Say."}
  ]},
 {p:"A museum replaced its fixed admission fee with a pay-what-you-wish policy on Wednesdays. Visitor numbers on Wednesdays roughly doubled. Average revenue per visitor on those days fell, though total Wednesday revenue rose slightly. Attendance on other days was unchanged.",
  s:[
   {t:"Total revenue on Wednesdays increased.",a:"T",ar:"النص يفرّق بين رقمين: متوسط الإيراد للزائر انخفض، والإيراد الكلي ليوم الأربعاء ارتفع قليلًا. العبارة تخصّ الكلي. True.",en:"The passage separates two figures: revenue per visitor fell while total Wednesday revenue rose slightly. The statement concerns the total. True."},
   {t:"Attendance on the other days of the week declined.",a:"F",ar:"النص يقصر التغيّر على يوم الأربعاء ويقول إن الحضور في بقية الأيام لم يتغيّر. False.",en:"The passage confines the change to Wednesdays and says attendance on other days was unchanged. False."},
   {t:"The policy will be extended to the rest of the week.",a:"CS",ar:"النص يصف ما جرى يوم الأربعاء ولا يذكر أي نية للتوسعة. غياب الخطة ليس نفيًا لها. Can't Say.",en:"The passage describes what happened on Wednesdays and mentions no intention to extend. The absence of a plan is not a denial of one. Can't Say."}
  ]},
 {p:"A telecoms operator extended coverage to forty rural villages last year. Complaints about dropped calls in those villages fell. The operator has not published the cost of the expansion. A government subsidy was available for rural coverage projects, though the operator has not said whether it applied.",
  s:[
   {t:"Complaints about dropped calls in those villages decreased.",a:"T",ar:"النص يربط الانخفاض بالقرى التي وصلتها التغطية تحديدًا، والعبارة نقلت القيد نفسه. True.",en:"The passage ties the fall specifically to the villages that received coverage, and the statement keeps the same qualifier. True."},
   {t:"The operator disclosed the cost of the expansion.",a:"F",ar:"النص يقول إن المشغّل لم ينشر التكلفة. الإفصاح يناقض عدم النشر مباشرة. False.",en:"The passage says the operator has not published the cost. Disclosure directly contradicts non-publication. False."},
   {t:"The operator received a government subsidy for the project.",a:"CS",ar:"وجود الدعم مذكور، لكن تقديم الشركة عليه غير معلوم. توفّر شيء لا يعني الحصول عليه. Can't Say.",en:"The subsidy's existence is stated, but whether the operator applied is not. Availability is not receipt. Can't Say."}
  ]},
 {p:"A vertical farm grows leafy greens indoors under artificial light. Yield per square metre is far higher than in open fields. Electricity is its largest single cost. The farm sells only within the city where it operates.",
  s:[
   {t:"Electricity is the farm's biggest single cost.",a:"T",ar:"منصوص عليه بلفظ largest single cost. True.",en:"Stated in those terms as the largest single cost. True."},
   {t:"The farm sells its produce in other cities as well.",a:"F",ar:"لفظ only يحصر البيع داخل المدينة. False.",en:"The word \"only\" confines sales to the city. False."},
   {t:"Vertical farming is more profitable than field farming.",a:"CS",ar:"النص يقارن الإنتاجية للمتر لا الربحية، وهما شيئان مختلفان. Can't Say.",en:"The passage compares yield per square metre, not profitability — two different things. Can't Say."}
  ]},
 {p:"A court system introduced digital filing for civil claims. The time between filing and a first hearing fell from fourteen weeks to nine. The number of claims filed rose over the same period. Judges' working hours did not change.",
  s:[
   {t:"The wait for a first hearing shortened by five weeks.",a:"T",ar:"من 14 إلى 9 فرقه 5 أسابيع. حساب مباشر داخل النص. True.",en:"From fourteen to nine is a difference of five weeks — a direct calculation. True."},
   {t:"Judges worked longer hours after the change.",a:"F",ar:"النص يقول إن ساعات عملهم لم تتغيّر. False.",en:"The passage says their hours did not change. False."},
   {t:"Digital filing caused the rise in the number of claims.",a:"CS",ar:"الارتفاع مذكور والسبب غير منسوب. Can't Say.",en:"The rise is stated and no cause is assigned. Can't Say."}
  ]},
 {p:"A stadium lowered ticket prices for midweek fixtures. Attendance at those fixtures rose by a third. Ticket revenue from midweek fixtures was roughly unchanged. Spending on food and drink inside the ground increased.",
  s:[
   {t:"Attendance at midweek fixtures increased.",a:"T",ar:"النص يعطي المقدار: ارتفاع بمقدار الثلث في مباريات منتصف الأسبوع. العبارة أعمّ من الرقم لكنها متسقة معه. True.",en:"The passage gives the size of the rise: a third, at midweek fixtures. The statement is broader than the figure but consistent with it. True."},
   {t:"Midweek ticket revenue fell sharply.",a:"F",ar:"النص يقول إنها بقيت دون تغيّر يُذكر: حضور أكبر بسعر أقل تعادلا. False.",en:"The passage says it was roughly unchanged: more attendance at a lower price cancelled out. False."},
   {t:"The stadium will lower weekend prices too.",a:"CS",ar:"لا ذكر لأسعار نهاية الأسبوع. Can't Say.",en:"Weekend pricing is not mentioned. Can't Say."}
  ]},
 {p:"A university began teaching two engineering modules in English rather than the national language. Pass rates in those modules fell in the first year and recovered in the second. Demand for places on the programme rose. The teaching staff were unchanged.",
  s:[
   {t:"Pass rates in the two modules dropped in the first year.",a:"T",ar:"مذكور نصًّا قبل ذكر التعافي في السنة الثانية. True.",en:"Stated directly, before the recovery in the second year. True."},
   {t:"New teaching staff were brought in for the two modules.",a:"F",ar:"النص يقول إن هيئة التدريس لم تتغيّر. False.",en:"The passage says the teaching staff were unchanged. False."},
   {t:"The recovery in pass rates was due to students adapting to English.",a:"CS",ar:"التعافي مذكور وسببه غير مذكور. التفسير معقول لكنه من خارج النص. Can't Say.",en:"The recovery is stated and its cause is not. The explanation is plausible but comes from outside the text. Can't Say."}
  ]},
 {p:"A country required warning labels on the front of packs for products high in sugar. Sales of labelled products fell in the following year. Several manufacturers reformulated products to fall below the threshold. Sales of unlabelled substitutes rose.",
  s:[
   {t:"Some manufacturers changed their recipes after the rule.",a:"T",ar:"إعادة التركيب للنزول تحت الحد مذكورة نصًّا. True.",en:"Reformulating to fall below the threshold is stated directly. True."},
   {t:"Sales of labelled products increased.",a:"F",ar:"النص يقول إن مبيعات المنتجات الموسومة انخفضت في السنة التالية. الارتفاع يناقضه. False — ولا تخلط بينها وبين مبيعات البدائل غير الموسومة التي ارتفعت فعلًا.",en:"The passage says sales of labelled products fell in the following year. A rise contradicts that. False — and do not confuse it with sales of unlabelled substitutes, which did rise."},
   {t:"Overall sugar consumption in the country fell.",a:"CS",ar:"مبيعات المنتجات الموسومة انخفضت لكن البدائل غير الموسومة ارتفعت، والنص لا يعطي المحصّلة. Can't Say — وهذا فخّ متكرر: انتقال بين فئتين لا يعني انخفاضًا كليًا.",en:"Sales of labelled products fell but unlabelled substitutes rose, and the passage gives no net figure. Can't Say — a recurring trap: a shift between categories is not an overall fall."}
  ]},
 {p:"An airport opened a second runway. Delays attributed to congestion fell. Noise complaints from nearby residents rose. The airport operates a night-time flight curfew, which was not changed.",
  s:[
   {t:"The night-time curfew remained in place.",a:"T",ar:"النص يقول إنه لم يُغيَّر، أي أنه قائم. True.",en:"The passage says it was not changed, meaning it still applies. True."},
   {t:"Noise complaints declined after the runway opened.",a:"F",ar:"النص يقول إن شكاوى الضجيج من السكان المجاورين ارتفعت. الانخفاض يناقضه. False.",en:"The passage says noise complaints from nearby residents rose. A decline contradicts that. False."},
   {t:"The second runway increased the airport's profits.",a:"CS",ar:"لا ذكر للأرقام المالية إطلاقًا. Can't Say.",en:"No financial figures are mentioned at all. Can't Say."}
  ]},
 {p:"A city introduced a subsidised electric-bike scheme for commuters. Applications exceeded the number of subsidies available. Recipients reported cycling more often than before. Car use among recipients was not measured.",
  s:[
   {t:"Demand for the subsidy exceeded the number available.",a:"T",ar:"عبارة النص أن الطلبات تجاوزت عدد الدعومات المتاحة، وهذا تعريف تجاوز الطلب للعرض. True.",en:"The passage says applications exceeded the number of subsidies available, which is what demand exceeding supply means. True."},
   {t:"The scheme measured recipients' car use.",a:"F",ar:"النص يقول صراحة إن استخدام السيارة لم يُقس. العبارة تثبت القياس فتناقضه. False.",en:"The passage states explicitly that car use was not measured. The statement asserts measurement and contradicts it. False."},
   {t:"The scheme reduced the number of car journeys in the city.",a:"CS",ar:"استخدام السيارة لم يُقس أصلًا، فالنص يغلق باب هذا الاستنتاج. Can't Say.",en:"Car use was never measured, so the passage closes off this inference. Can't Say."}
  ]},
 {p:"A pharmacy chain extended opening hours at branches near hospitals. Prescription volumes at those branches rose. Staff turnover at the extended branches increased. The chain pays a premium for evening shifts.",
  s:[
   {t:"The chain pays extra for evening shifts.",a:"T",ar:"النص يذكر أن السلسلة تدفع علاوة على ورديات المساء، والعلاوة هي الدفع الزائد. True.",en:"The passage says the chain pays a premium for evening shifts, and a premium is exactly extra pay. True."},
   {t:"Staff turnover at the extended branches fell.",a:"F",ar:"النص يقول إن دوران الموظفين في الفروع الممتدة ارتفع. الانخفاض يناقضه. False.",en:"The passage says staff turnover at the extended branches increased. A fall contradicts that. False."},
   {t:"The longer hours caused the rise in staff turnover.",a:"CS",ar:"الأمران مذكوران معًا دون ربط سببي، ووجود علاوة المساء يعقّد الصورة. Can't Say.",en:"Both facts are stated without a causal link, and the evening premium complicates the picture. Can't Say."}
  ]},
 {p:"A company moved its customer database from its own servers to a cloud provider. Monthly infrastructure costs fell. The company now depends on the provider's uptime guarantees. Two brief outages occurred in the first year, both resolved within an hour.",
  s:[
   {t:"Monthly infrastructure costs decreased after the move.",a:"T",ar:"النص يذكر انخفاض التكاليف الشهرية للبنية التحتية عقب الانتقال إلى السحابة مباشرة. True.",en:"The passage records a fall in monthly infrastructure costs directly following the move to the cloud. True."},
   {t:"No outages occurred during the first year.",a:"F",ar:"النص يذكر انقطاعين قصيرين في السنة الأولى، حُلّا خلال ساعة. قِصَر الانقطاع لا يجعله غير واقع. False.",en:"The passage records two brief outages in the first year, each resolved within an hour. Being brief does not make them non-events. False."},
   {t:"The move improved the system's overall reliability.",a:"CS",ar:"النص يعطي عدد الانقطاعات بعد الانتقال ولا يعطي ما قبله، فالمقارنة غير ممكنة. Can't Say.",en:"The passage gives outages after the move but none before, so no comparison is possible. Can't Say."}
  ]},
 {p:"A cooperative switched half its members' fields to a slow-release fertiliser. Nitrogen run-off into nearby streams fell on those fields. Yields were similar to the previous season. The slow-release product costs more per hectare.",
  s:[
   {t:"The slow-release product is more expensive per hectare.",a:"T",ar:"النص يقول إن المنتج بطيء التحرّر أعلى تكلفة لكل هكتار. العبارة نقل حرفي للمقارنة. True.",en:"The passage says the slow-release product costs more per hectare. The statement simply restates that comparison. True."},
   {t:"Yields dropped sharply on the treated fields.",a:"F",ar:"النص يقول إنها كانت مشابهة للموسم السابق. False.",en:"The passage says yields were similar to the previous season. False."},
   {t:"The cooperative will convert the remaining fields.",a:"CS",ar:"النص يصف ما جرى على نصف الحقول ولا يذكر نية للنصف الباقي. Can't Say.",en:"The passage describes what was done on half the fields and says nothing about the remaining half. Can't Say."}
  ]},
 {p:"A publisher moved its magazine archive behind a paywall. Monthly page views fell. Subscription revenue rose and now exceeds the advertising revenue the free archive had generated. Some articles remain free.",
  s:[
   {t:"Subscription revenue now exceeds what the free archive earned from advertising.",a:"T",ar:"المقارنة معقودة صراحة في النص. True.",en:"The comparison is made explicitly in the passage. True."},
   {t:"Every article is now behind the paywall.",a:"F",ar:"النص يقول إن بعض المقالات ما زالت مجانية. False.",en:"The passage says some articles remain free. False."},
   {t:"Readers who stopped visiting will return.",a:"CS",ar:"توقّع مستقبلي لا يتناوله النص. Can't Say.",en:"A prediction the passage does not address. Can't Say."}
  ]},
 {p:"A manufacturer doubled the size of its apprenticeship intake. Completion rates in the larger cohort were lower than in the previous one. The firm assigned the same number of supervising engineers to both cohorts. Apprentices who completed were offered permanent roles.",
  s:[
   {t:"The larger cohort had a lower completion rate than the previous one.",a:"T",ar:"المقارنة معقودة صراحة في النص بين الفوج الأكبر والفوج السابق. True.",en:"The comparison between the larger cohort and the previous one is made explicitly in the passage. True."},
   {t:"More supervising engineers were assigned to the larger cohort.",a:"F",ar:"النص يقول العدد نفسه للفوجين. False.",en:"The passage says the same number covered both cohorts. False."},
   {t:"The supervision ratio explains the lower completion rate.",a:"CS",ar:"المعطيات تسمح بالتخمين، لكن النص لا يقرّر السبب. Can't Say.",en:"The facts invite the guess, but the passage never states the cause. Can't Say."}
  ]},
 {p:"A utility installed battery storage alongside a solar plant. Electricity supplied during evening peak hours rose. The batteries lose a small share of stored energy in each charge cycle. The utility has not disclosed the batteries' expected lifespan.",
  s:[
   {t:"The batteries lose some energy in each charge cycle.",a:"T",ar:"النص يذكر أن البطاريات تفقد حصة صغيرة من الطاقة المخزّنة في كل دورة شحن. «حصة صغيرة» تبقى فقدًا. True.",en:"The passage says the batteries lose a small share of stored energy in each charge cycle. A small share is still a loss. True."},
   {t:"The utility published the batteries' expected lifespan.",a:"F",ar:"النص يقول إن المرفق لم يُفصح عن العمر المتوقّع. النشر يناقض عدم الإفصاح. False.",en:"The passage says the utility has not disclosed the expected lifespan. Publication contradicts non-disclosure. False."},
   {t:"The batteries will recover their cost.",a:"CS",ar:"لا تكلفة ولا عمر متوقّع في النص، فلا سبيل للحكم. Can't Say.",en:"Neither cost nor expected lifespan appears, so no judgement is possible. Can't Say."}
  ]},
 {p:"A hotel chain began responding publicly to online reviews. Its average review score rose over the following year. The chain also refurbished four of its twelve properties during that period. Occupancy rates were broadly unchanged.",
  s:[
   {t:"The chain refurbished a third of its properties.",a:"T",ar:"أربعة من اثني عشر هي الثلث بالضبط. حساب داخل النص. True.",en:"Four out of twelve is exactly a third — a calculation inside the text. True."},
   {t:"Occupancy rates rose over the period.",a:"F",ar:"النص يقول إنها لم تتغيّر يُذكر. False.",en:"The passage says they were broadly unchanged. False."},
   {t:"Responding to reviews raised the average score.",a:"CS",ar:"التجديد جرى في الفترة نفسها، فالنص لا يعزل أثر الردود. Can't Say.",en:"Refurbishment happened in the same period, so the passage does not isolate the effect of the replies. Can't Say."}
  ]},
 {p:"A tax authority began pre-filling returns with income reported by employers. The share of returns filed on time rose. Corrections submitted after filing also rose. Self-employed taxpayers were not covered by the pre-filling.",
  s:[
   {t:"Self-employed taxpayers' returns were not pre-filled.",a:"T",ar:"النص يستثني العاملين لحسابهم من التعبئة المسبقة صراحة. True.",en:"The passage explicitly excludes the self-employed from the pre-filling. True."},
   {t:"Filing late became more common after the change.",a:"F",ar:"النص يقول إن نسبة التقديم في الموعد ارتفعت، أي أن التأخّر قلّ. False.",en:"The passage says on-time filing rose, which means late filing fell. False."},
   {t:"Pre-filling introduced more errors into returns.",a:"CS",ar:"التصحيحات ارتفعت، لكن ارتفاعها قد يعود إلى سهولة التصحيح أو إلى كثرة المقدِّمين. النص لا يحسم. Can't Say.",en:"Corrections rose, but that could reflect easier correcting or more filers. The passage does not settle it. Can't Say."}
  ]},
 {p:"A highway authority built two wildlife crossings over a motorway. Recorded collisions between animals and vehicles on that stretch fell. Camera traps showed regular use of both crossings. Collisions on an adjacent stretch without crossings were unchanged.",
  s:[
   {t:"Both crossings were used regularly by animals.",a:"T",ar:"كاميرات الرصد أظهرت الاستخدام المنتظم للاثنين. True.",en:"The camera traps showed regular use of both. True."},
   {t:"Collisions rose on the stretch where the crossings were built.",a:"F",ar:"النص يقول إن الاصطدامات انخفضت على ذلك المقطع، وأن المقطع المجاور بلا معابر بقي دون تغيّر. الارتفاع يناقض النص. False.",en:"The passage says collisions fell on that stretch, while the adjacent stretch without crossings was unchanged. A rise contradicts the text. False."},
   {t:"The crossings were a cost-effective use of funds.",a:"CS",ar:"لا تكلفة في النص، والجدوى حكم يحتاج رقمًا غير موجود. Can't Say.",en:"No cost appears, and value for money needs a figure the passage does not give. Can't Say."}
  ]},
 {p:"A hospital began having routine scans reported remotely by specialists in another city. Reporting time fell from three days to one. The proportion of scans requiring a second opinion was unchanged. Local radiographers continue to perform the scans.",
  s:[
   {t:"Reporting time was cut by two days.",a:"T",ar:"من ثلاثة أيام إلى يوم فرقه يومان. True.",en:"From three days to one is a difference of two days. True."},
   {t:"The scans themselves are now performed remotely.",a:"F",ar:"النص يقول إن الفنيين المحليين ما زالوا يجرون التصوير؛ البعيد هو التقرير لا التصوير. False.",en:"The passage says local radiographers still perform the scans; what moved was the reporting, not the scanning. False."},
   {t:"Remote reporting improved diagnostic accuracy.",a:"CS",ar:"نسبة الرأي الثاني لم تتغيّر، وهذا لا يقيس الدقة. Can't Say.",en:"The second-opinion rate was unchanged, which does not measure accuracy. Can't Say."}
  ]},
 {p:"A utility introduced a tiered water tariff in which heavy users pay a higher rate per unit. Total household consumption fell by 6%. Consumption among the lowest-use group was unchanged. Complaints about billing rose in the first two months.",
  s:[
   {t:"Heavy users pay more per unit than other households.",a:"T",ar:"هذا تعريف التعرفة المتدرّجة كما وصفها النص. True.",en:"This is what the passage describes the tiered tariff as doing. True."},
   {t:"The lowest-use group also cut its consumption.",a:"F",ar:"النص يقول إن استهلاكها لم يتغيّر. False.",en:"The passage says its consumption was unchanged. False."},
   {t:"The tariff will be extended to businesses.",a:"CS",ar:"النص يتحدّث عن الأسر فقط. Can't Say.",en:"The passage concerns households only. Can't Say."}
  ]}
];

var NUM=[
 {stem:"A branch sold 120,000 SAR in Q1 2023 and 138,000 SAR in Q1 2024. What was the percentage growth?",
  tbl:[["Year","Q1","Q2"],["2023","120","150"],["2024","138","171"],["(thousands)","",""]],
  ch:["12%","15%","18%","20%"],a:1,
  ar:"الفرق 18 من أصل 120. القانون: (new − old) ÷ old × 100 = 18 ÷ 120 × 100 = 15%. لاحظ أن عمود الربع الثاني موجود لكنه لا يدخل في السؤال إطلاقًا — هذا نمط التشتيت المتكرر.",
  en:"The difference is 18 on a base of 120. Using (new − old) ÷ old × 100 = 18 ÷ 120 × 100 = 15%. Note that the Q2 column is present but plays no part in the question — that is the standard distractor pattern."},
 {stem:"After a 25% increase, a machine's price is 90,000 SAR. What was the price before the increase?",
  ch:["67,500 SAR","70,000 SAR","72,000 SAR","112,500 SAR"],a:2,
  ar:"القانون: old = new ÷ (1 + %) = 90,000 ÷ 1.25 = 72,000. الخطأ الشائع هو طرح 25% من 90,000 مباشرة، وهذا يعطي 67,500 وهو الخيار الفخّ.",
  en:"old = new ÷ (1 + %) = 90,000 ÷ 1.25 = 72,000. The common error is subtracting 25% from 90,000 directly, which gives 67,500 — the distractor."},
 {stem:"A department's budget is 4,000,000 SAR. Training receives 6% of it. How much is that?",
  ch:["24,000 SAR","240,000 SAR","2,400,000 SAR","400,000 SAR"],a:1,
  ar:"القانون: A = Total × %A = 4,000,000 × 0.06 = 240,000. أكثر الأخطاء هنا خطأ في عدد الأصفار لا في الطريقة — تحقّق من رتبة الناتج دائمًا.",
  en:"A = Total × %A = 4,000,000 × 0.06 = 240,000. Most errors here are in the number of zeros rather than the method — always sanity-check the order of magnitude."},
 {stem:"The ratio of engineers to technicians on a site is 3 : 5. There are 45 engineers. How many technicians are there?",
  ch:["27","60","75","135"],a:2,
  ar:"من 3 إلى 45 المعامل هو 15. إذن الفنيون = 5 × 15 = 75. تنبّه لاتجاه النسبة: عكسها يعطي 27 وهو الخيار الفخّ.",
  en:"Going from 3 to 45 gives a multiplier of 15, so technicians = 5 × 15 = 75. Watch the direction of the ratio: reversing it gives 27, the distractor."},
 {stem:"1 USD = 3.75 SAR. A supplier invoices 12,000 SAR. What is the amount in USD?",
  ch:["3,200 USD","4,500 USD","32,000 USD","45,000 USD"],a:0,
  ar:"من العملة الضعيفة إلى القوية نقسم: 12,000 ÷ 3.75 = 3,200 دولارًا. الضرب بدل القسمة يعطي 45,000 وهو الفخّ. اختبار سريع للمنطق: عدد الدولارات يجب أن يكون أقل من عدد الريالات.",
  en:"Weak currency to strong means dividing: 12,000 ÷ 3.75 = 3,200 USD. Multiplying instead gives 45,000, the distractor. Quick sanity check: the dollar figure must be smaller than the riyal figure."},
 {stem:"An investor buys 1,500 shares at 46 SAR each. What is the total cost?",
  ch:["6,900 SAR","69,000 SAR","690,000 SAR","32.6 SAR"],a:1,
  ar:"المبلغ = عدد الأسهم × سعر السهم = 1,500 × 46 = 69,000 ريالًا. القانون نفسه يُقلب لإيجاد أي طرف مجهول: عدد الأسهم = المبلغ ÷ السعر.",
  en:"Amount = shares × price = 1,500 × 46 = 69,000 SAR. The same relation rearranges for any unknown: shares = amount ÷ price."},
 {stem:"Output over four months was 220, 260, 310 and 250 units. What was the monthly average?",
  ch:["250","255","260","265"],a:2,
  ar:"المجموع 1,040 على 4 شهور = 260. تنبّه: كثيرون يجمعون ثلاثة أرقام فقط تحت ضغط الوقت. أعد عدّ المدخلات قبل القسمة.",
  en:"The total is 1,040 over 4 months = 260. Under time pressure many people add only three of the figures — recount the inputs before dividing."},
 {stem:"A price rises by 20% and then falls by 20%. Compared with the original price, the final price is:",
  ch:["the same","4% lower","4% higher","10% lower"],a:1,
  ar:"الزيادة تُحسب على القيمة القديمة والنقص على الجديدة. 100 → 120 → 96، أي أقل بـ 4%. أي سؤال فيه تغيّران متتاليان يستحق تمهّلًا، فالتساوي هنا خطأ حدسي شائع.",
  en:"The rise is applied to the old value and the fall to the new one: 100 → 120 → 96, which is 4% lower. Any question with two consecutive changes deserves a pause; \"the same\" is the intuitive trap."},
 {stem:"Of 2,400 applicants, 15% passed the first stage and one third of those passed the second. How many passed the second stage?",
  ch:["80","120","360","800"],a:1,
  ar:"خطوتان: 2,400 × 0.15 = 360 اجتازوا الأولى، ثم 360 ÷ 3 = 120. الخيار 360 موضوع لمن يتوقف عند الخطوة الأولى.",
  en:"Two steps: 2,400 × 0.15 = 360 pass the first stage, then 360 ÷ 3 = 120. The 360 option is there for anyone who stops after step one."},
 {stem:"A contract is worth 850,000 SAR, of which 35% is labour. If labour costs rise by 10%, what is the new labour cost?",
  ch:["297,500 SAR","327,250 SAR","318,750 SAR","935,000 SAR"],a:1,
  ar:"العمالة = 850,000 × 0.35 = 297,500، ثم × 1.10 = 327,250. الخيار الأول هو قيمة العمالة قبل الزيادة، وهو الفخّ لمن ينسى الخطوة الثانية.",
  en:"Labour = 850,000 × 0.35 = 297,500, then × 1.10 = 327,250. The first option is the labour cost before the rise — the trap for anyone who forgets the second step."},
 {stem:"A plant produced 8,400 units, of which 1,260 failed inspection. What percentage failed?",
  ch:["12%","15%","18%","21%"],a:1,
  ar:"القانون: %A = A ÷ Total × 100 = 1,260 ÷ 8,400 × 100 = 15%.",
  en:"%A = A ÷ Total × 100 = 1,260 ÷ 8,400 × 100 = 15%."},
 {stem:"After a 12% discount, a contract is worth 154,000 SAR. What was it worth before the discount?",
  ch:["166,320 SAR","172,480 SAR","175,000 SAR","190,960 SAR"],a:2,
  ar:"القانون: old = new ÷ (1 − %) = 154,000 ÷ 0.88 = 175,000. إضافة 12% إلى 154,000 تعطي 172,480 وهي خطأ، لأن الخصم حُسب على القيمة الأصلية لا على المخفّضة.",
  en:"old = new ÷ (1 − %) = 154,000 ÷ 0.88 = 175,000. Adding 12% to 154,000 gives 172,480, which is wrong: the discount was taken from the original, not from the discounted figure."},
 {stem:"Revenue is split between three units in the ratio 2 : 3 : 5. Total revenue is 1,200,000 SAR. What does the largest unit receive?",
  ch:["240,000 SAR","360,000 SAR","500,000 SAR","600,000 SAR"],a:3,
  ar:"مجموع أطراف النسبة 10، ونصيب الأكبر 5 منها، أي النصف: 1,200,000 × 5 ÷ 10 = 600,000. الخطأ الشائع قسمة المبلغ على 5 مباشرة.",
  en:"The ratio parts total 10 and the largest takes 5 of them, i.e. half: 1,200,000 × 5 ÷ 10 = 600,000. The common error is dividing the total by 5 directly."},
 {stem:"1 EUR = 4.10 SAR. An invoice of 8,200 SAR is equal to how many euros?",
  ch:["2,000 EUR","2,050 EUR","20,000 EUR","33,620 EUR"],a:0,
  ar:"من العملة الضعيفة إلى القوية نقسم: 8,200 ÷ 4.10 = 2,000 يورو. الضرب يعطي 33,620 وهو الفخّ.",
  en:"Weak to strong means dividing: 8,200 ÷ 4.10 = 2,000 EUR. Multiplying gives 33,620, the distractor."},
 {stem:"1 USD = 3.75 SAR. A payment of 3,000 USD is equal to how many riyals?",
  ch:["800 SAR","8,000 SAR","11,250 SAR","1,125 SAR"],a:2,
  ar:"من العملة القوية إلى الضعيفة نضرب: 3,000 × 3.75 = 11,250 ريالًا. القسمة تعطي 800 وهو الفخّ.",
  en:"Strong to weak means multiplying: 3,000 × 3.75 = 11,250 SAR. Dividing gives 800, the distractor."},
 {stem:"A workforce of 1,800 includes 25% contractors. Of the contractors, 40% work on site. How many contractors work on site?",
  ch:["180","200","450","720"],a:0,
  ar:"خطوتان: 1,800 × 0.25 = 450 متعاقدًا، ثم 450 × 0.40 = 180. الخيار 450 موضوع لمن يتوقف عند الخطوة الأولى، و720 لمن يطبّق 40% على العدد الكلي.",
  en:"Two steps: 1,800 × 0.25 = 450 contractors, then 450 × 0.40 = 180. The 450 option is for anyone who stops at step one, and 720 for anyone who applies 40% to the whole workforce."},
 {stem:"Output over four quarters averaged 320 units. The first three quarters were 290, 340 and 310. What was the fourth?",
  ch:["320","330","340","350"],a:2,
  ar:"المجموع المطلوب = 320 × 4 = 1,280. مجموع الثلاثة الأولى 940. الرابع = 1,280 − 940 = 340. اقلب قانون المتوسط بدل تخمين الرقم.",
  en:"The required total is 320 × 4 = 1,280. The first three sum to 940, so the fourth is 1,280 − 940 = 340. Reverse the averaging formula rather than guessing the figure."},
 {stem:"Costs fell from 2,400,000 SAR to 2,040,000 SAR. What was the percentage decrease?",
  ch:["12%","15%","18%","36%"],a:1,
  ar:"الفرق 360,000 من أصل 2,400,000، أي 15%. القانون نفسه يخدم الزيادة والنقص، والفارق فقط في إشارة الناتج.",
  en:"The difference is 360,000 on a base of 2,400,000, i.e. 15%. The same formula serves rises and falls; only the sign of the result differs."},
 {stem:"A shipment of 750 units cost 33,750 SAR in total. What was the cost per unit?",
  ch:["35 SAR","40 SAR","45 SAR","50 SAR"],a:2,
  ar:"الإجمالي = عدد القطع × تكلفة القطعة، فالتكلفة = 33,750 ÷ 750 = 45 ريالًا.",
  en:"Total = units × cost per unit, so cost per unit = 33,750 ÷ 750 = 45 SAR."},
 {stem:"A department has 84 staff, which is 12% of the company's total. How many staff does the company have?",
  ch:["588","700","1,008","1,050"],a:1,
  ar:"القانون: Total = A ÷ %A = 84 ÷ 0.12 = 700. الضرب في 12 بدل القسمة على 0.12 يعطي 1,008 وهو الفخّ.",
  en:"Total = A ÷ %A = 84 ÷ 0.12 = 700. Multiplying by 12 instead of dividing by 0.12 gives 1,008, the distractor."},
 {stem:"Region A recorded sales of 240 and Region B recorded 180. What is the ratio of A to B in its simplest form?",
  tbl:[["Region","Sales","Branches"],["A","240","6"],["B","180","5"],["C","300","8"]],
  ch:["3 : 4","4 : 3","5 : 4","6 : 5"],a:1,
  ar:"اقسم الطرفين على القاسم المشترك 60: 240 : 180 يصبح 4 : 3. انتبه لاتجاه النسبة، فعكسها 3 : 4 وهو الفخّ. وعمودا الفروع والمنطقة C لا يدخلان في السؤال.",
  en:"Divide both sides by the common factor 60: 240 : 180 becomes 4 : 3. Watch the direction — reversed it gives 3 : 4, the distractor. The branches column and Region C play no part."},
 {stem:"Output of 5,000 units grows by 10% in each of two consecutive years. What is the output after two years?",
  ch:["6,000","6,050","6,100","5,500"],a:1,
  ar:"سنة بعد سنة: 5,000 × 1.10 = 5,500، ثم 5,500 × 1.10 = 6,050. جمع 20% دفعة واحدة يعطي 6,000 وهو الفخّ، لأن الزيادة الثانية تُحسب على القيمة الجديدة.",
  en:"Year by year: 5,000 × 1.10 = 5,500, then 5,500 × 1.10 = 6,050. Adding 20% in one go gives 6,000, the distractor, because the second rise is calculated on the new value."},
 {stem:"A company's market share rose from 12% to 15%. By what percentage did its share increase?",
  ch:["3%","12%","25%","27%"],a:2,
  ar:"القيمة ارتفعت من 12 إلى 15، والفرق 3 من أصل 12، أي 25%. الخيار 3% هو الفرق بالنقاط المئوية لا بالنسبة، وهذا أشهر التباس في هذا القسم: النقطة المئوية شيء والنسبة المئوية شيء آخر.",
  en:"The value rose from 12 to 15: a difference of 3 on a base of 12, i.e. 25%. The 3% option is the gap in percentage points, not the percentage increase — the classic confusion in this section between a percentage point and a percentage."},
 {stem:"One site has 60 workers averaging 8 units each; another has 40 workers averaging 13 each. What is the average output per worker across both sites?",
  ch:["10","10.5","11","12"],a:0,
  ar:"لا تأخذ متوسط المتوسطين. احسب الإنتاج الكلي: (60 × 8) + (40 × 13) = 480 + 520 = 1,000، على 100 عامل = 10 وحدات. متوسط المتوسطين يعطي 10.5 وهو الفخّ.",
  en:"Do not average the two averages. Take total output: (60 × 8) + (40 × 13) = 480 + 520 = 1,000, over 100 workers = 10 units. Averaging the averages gives 10.5, the distractor."},
 {stem:"A table of branch revenue is headed \"figures in thousands\". One branch shows 1,450. What is its actual revenue?",
  ch:["14,500 SAR","145,000 SAR","1,450,000 SAR","14,500,000 SAR"],a:2,
  ar:"«بالآلاف» تعني ضرب الرقم في 1,000: 1,450 × 1,000 = 1,450,000. إغفال رأس الجدول هو أكثر أسباب الخطأ في هذا القسم، وليس الحساب.",
  en:"\"In thousands\" means multiplying by 1,000: 1,450 × 1,000 = 1,450,000. Overlooking the table heading causes more errors in this section than the arithmetic does."},
 {stem:"A crew lays 240 metres of pipe in 6 hours. At the same rate, how long will 400 metres take?",
  ch:["8 hours","9 hours","10 hours","12 hours"],a:2,
  ar:"المعدّل = 240 ÷ 6 = 40 مترًا في الساعة، ثم 400 ÷ 40 = 10 ساعات. احسب معدّل الوحدة أولًا دائمًا في أسئلة المعدّلات.",
  en:"The rate is 240 ÷ 6 = 40 metres an hour, then 400 ÷ 40 = 10 hours. In rate questions, always work out the unit rate first."},
 {stem:"An item priced at 2,000 SAR is sold with a 15% discount, and 15% VAT is then added. What is the final price?",
  ch:["1,955 SAR","2,000 SAR","1,700 SAR","2,045 SAR"],a:0,
  ar:"2,000 × 0.85 = 1,700، ثم 1,700 × 1.15 = 1,955. الخصم والضريبة بالنسبة نفسها لا يلغي أحدهما الآخر، لأن كلًّا منهما يُحسب على قاعدة مختلفة.",
  en:"2,000 × 0.85 = 1,700, then 1,700 × 1.15 = 1,955. A discount and a tax at the same rate do not cancel out, because each is applied to a different base."},
 {stem:"A budget of 600,000 SAR allocates 40% to salaries. A quarter of the remainder goes to training. How much goes to training?",
  ch:["60,000 SAR","90,000 SAR","150,000 SAR","240,000 SAR"],a:1,
  ar:"الرواتب 240,000، فالمتبقي 360,000، وربعه 90,000. الخيار 150,000 موضوع لمن يأخذ ربع الميزانية كاملة بدل ربع المتبقي.",
  en:"Salaries take 240,000, leaving 360,000, a quarter of which is 90,000. The 150,000 option is for anyone taking a quarter of the whole budget instead of a quarter of the remainder."},
 {stem:"Of 5,000 applicants, 8% were shortlisted and 25% of those were hired. How many were hired?",
  ch:["100","125","400","1,000"],a:0,
  ar:"5,000 × 0.08 = 400 مرشّحًا، ثم 400 × 0.25 = 100. الخيار 400 لمن يتوقف عند الخطوة الأولى.",
  en:"5,000 × 0.08 = 400 shortlisted, then 400 × 0.25 = 100. The 400 option is for anyone who stops at step one."},
 {stem:"Fixed costs are 120,000 SAR and each unit sold contributes 30 SAR. How many units must be sold to cover the fixed costs?",
  ch:["3,000","3,600","4,000","4,800"],a:2,
  ar:"عدد الوحدات = التكاليف الثابتة ÷ مساهمة الوحدة = 120,000 ÷ 30 = 4,000 وحدة.",
  en:"Units = fixed costs ÷ contribution per unit = 120,000 ÷ 30 = 4,000 units."},
 {stem:"Which region recorded the largest percentage increase from 2023 to 2024?",
  tbl:[["Region","2023","2024"],["North","480","552"],["South","620","589"],["East","350","434"],["West","900","918"],["(SAR thousands)","",""]],
  ch:["North","South","East","West"],a:2,
  ar:"لا تحكم بالفرق المطلق. احسب النسبة لكل منطقة: الشمال 15%، الجنوب سالب 5%، الشرق 24%، الغرب 2%. الغرب أكبر رقمًا لكن نموّه الأصغر تقريبًا — وهذا هو الفخّ.",
  en:"Do not judge by the absolute gap. Work out each percentage: North 15%, South −5%, East 24%, West 2%. West has the biggest numbers but nearly the smallest growth — that is the trap."},
 {stem:"What was the combined 2024 figure for North and East?",
  tbl:[["Region","2023","2024"],["North","480","552"],["South","620","589"],["East","350","434"],["West","900","918"],["(SAR thousands)","",""]],
  ch:["986,000 SAR","830,000 SAR","9,860,000 SAR","98,600 SAR"],a:0,
  ar:"552 + 434 = 986، وبما أن الجدول بالآلاف فالناتج 986,000 ريال. الخيار 830,000 هو مجموع عمود 2023 للمنطقتين، موضوع لمن يقرأ العمود الخطأ.",
  en:"552 + 434 = 986, and since the table is in thousands the answer is 986,000 SAR. The 830,000 option is the 2023 total for the same two regions — there for anyone reading the wrong column."},
 {stem:"Which product generated the highest total revenue?",
  tbl:[["Product","Units sold","Unit price"],["A","1,200","45"],["B","800","62"],["C","1,500","28"]],
  ch:["Product A","Product B","Product C","They are equal"],a:0,
  ar:"لا يكفي النظر إلى عمود واحد. اضرب العمودين: أ = 54,000، ب = 49,600، ج = 42,000. المنتج ج الأكثر مبيعًا بالعدد، والمنتج ب الأغلى سعرًا، والأعلى إيرادًا ليس أيًّا منهما.",
  en:"One column is not enough. Multiply the two: A = 54,000, B = 49,600, C = 42,000. C sells the most units and B has the highest price, yet neither leads on revenue."},
 {stem:"Which branch generated the highest revenue per employee?",
  tbl:[["Branch","Revenue (SAR)","Employees"],["X","2,400,000","30"],["Y","1,800,000","20"],["Z","3,150,000","45"]],
  ch:["Branch X","Branch Y","Branch Z","Cannot be determined"],a:1,
  ar:"اقسم الإيراد على عدد الموظفين: س = 80,000، ص = 90,000، ع = 70,000. الفرع ع صاحب أعلى إيراد لكنه الأدنى لكل موظف — سؤال «لكل وحدة» يقلب الترتيب دائمًا تقريبًا.",
  en:"Divide revenue by headcount: X = 80,000, Y = 90,000, Z = 70,000. Z has the highest revenue but the lowest figure per employee — a \"per unit\" question almost always reorders the ranking."},
 {stem:"IT and Marketing together account for what percentage of the total budget?",
  tbl:[["Department","Budget (SAR)"],["Operations","1,200,000"],["IT","480,000"],["HR","240,000"],["Marketing","480,000"]],
  ch:["20%","30%","40%","48%"],a:2,
  ar:"اجمع القسمين: 480,000 + 480,000 = 960,000. والإجمالي غير معطى، فاجمع الأعمدة كلها: 2,400,000. النسبة = 960,000 ÷ 2,400,000 × 100 = 40%. الفخّ هو افتراض أن الإجمالي معطى.",
  en:"Add the two: 480,000 + 480,000 = 960,000. The total is not given, so sum the whole column: 2,400,000. The share is 960,000 ÷ 2,400,000 × 100 = 40%. The trap is assuming the total was supplied."},
 {stem:"An invoice of 9,600 SAR is equal to how many pounds?",
  tbl:[["Currency","Value in SAR"],["1 USD","3.75"],["1 EUR","4.10"],["1 GBP","4.80"]],
  ch:["1,750 GBP","2,000 GBP","2,341 GBP","46,080 GBP"],a:1,
  ar:"استخرج السطر الصحيح من الجدول أولًا، ثم اقسم لأن الاتجاه من الريال إلى العملة الأقوى: 9,600 ÷ 4.80 = 2,000 جنيه. الخيار 2,341 ناتج استخدام سعر اليورو بالخطأ.",
  en:"Pick the right row from the table first, then divide, since the direction is from riyals to the stronger currency: 9,600 ÷ 4.80 = 2,000 GBP. The 2,341 option comes from using the euro rate by mistake."},
 {stem:"Which production line had the highest defect rate?",
  tbl:[["Line","Units produced","Defective units"],["1","4,000","120"],["2","2,500","100"],["3","6,000","150"]],
  ch:["Line 1","Line 2","Line 3","Lines 1 and 3 are equal"],a:1,
  ar:"المعدّل نسبة لا عدد: الخط 1 = 3%، الخط 2 = 4%، الخط 3 = 2.5%. الخط 3 أكثر عددًا في العيوب لكنه الأقل معدّلًا لأن إنتاجه أكبر.",
  en:"A rate is a proportion, not a count: Line 1 = 3%, Line 2 = 4%, Line 3 = 2.5%. Line 3 has the most defective units but the lowest rate, because it produces the most."},
 {stem:"Q2 accounted for what percentage of annual revenue?",
  tbl:[["Quarter","Revenue (SAR)"],["Q1","1,150,000"],["Q2","1,380,000"],["Q3","920,000"],["Q4","1,150,000"]],
  ch:["25%","28%","30%","34%"],a:2,
  ar:"اجمع الأرباع الأربعة: 4,600,000. ثم 1,380,000 ÷ 4,600,000 × 100 = 30%. أي سؤال عن «نصيب من الإجمالي» يبدأ بجمع العمود لا بالقسمة.",
  en:"Sum the four quarters: 4,600,000. Then 1,380,000 ÷ 4,600,000 × 100 = 30%. Any \"share of the total\" question starts by summing the column, not by dividing."},
 {stem:"What was the percentage change in total costs from 2023 to 2024?",
  tbl:[["Cost","2023","2024"],["Materials","1,800,000","1,980,000"],["Labour","1,200,000","1,260,000"],["Overheads","600,000","540,000"]],
  ch:["3%","5%","6%","10%"],a:1,
  ar:"اجمع كل سنة قبل المقارنة: 2023 = 3,600,000 و2024 = 3,780,000. الفرق 180,000 على 3,600,000 = 5%. لا تحسب متوسط النسب الثلاث، فالبنود مختلفة الأحجام والمتوسط يعطي رقمًا خاطئًا.",
  en:"Total each year before comparing: 2023 = 3,600,000 and 2024 = 3,780,000. The difference of 180,000 on 3,600,000 is 5%. Do not average the three individual percentages: the lines differ in size and the average gives the wrong figure."},
 {stem:"Which store completed the most transactions?",
  tbl:[["Store","Footfall","Conversion rate"],["A","12,000","4%"],["B","9,000","6%"],["C","15,000","3%"]],
  ch:["Store A","Store B","Store C","Stores A and C are equal"],a:1,
  ar:"اضرب الزيارات في نسبة التحويل: أ = 480، ب = 540، ج = 450. المتجر ج الأكثر زيارات والأقل معاملات، وهذا نمط متكرر: العمود الأكبر ليس الجواب.",
  en:"Multiply footfall by conversion rate: A = 480, B = 540, C = 450. Store C has the most visitors and the fewest transactions — a recurring pattern: the largest column is not the answer."},
 {stem:"Revenue was 5,000,000 SAR and total costs were 3,750,000 SAR. What was the profit margin?",
  ch:["20%","25%","33%","75%"],a:1,
  ar:"الربح = 5,000,000 − 3,750,000 = 1,250,000، والهامش = الربح ÷ الإيراد = 25%. الخيار 33% ناتج القسمة على التكاليف بدل الإيراد، وهو الفخّ الأشهر في أسئلة الهامش.",
  en:"Profit = 5,000,000 − 3,750,000 = 1,250,000, and margin = profit ÷ revenue = 25%. The 33% option comes from dividing by costs instead of revenue — the classic margin trap."},
 {stem:"In which year was the profit margin highest?",
  tbl:[["Year","Revenue","Costs"],["2022","4,000,000","3,200,000"],["2023","5,000,000","3,750,000"],["2024","6,000,000","4,800,000"]],
  ch:["2022","2023","2024","All three were equal"],a:1,
  ar:"احسب الهامش لكل سنة لا الربح: 2022 = 20%، 2023 = 25%، 2024 = 20%. سنة 2024 صاحبة أكبر ربح بالريال (1,200,000) لكن هامشها ليس الأعلى — والسؤال عن الهامش.",
  en:"Work out the margin for each year, not the profit: 2022 = 20%, 2023 = 25%, 2024 = 20%. 2024 has the largest profit in riyals (1,200,000) but not the best margin — and the question asks for margin."},
 {stem:"An index rose from 250 points to 275. What was the percentage increase?",

/* ── مولّد أسئلة الأشكال: خمس صور معروضة والسادسة مطلوبة، وخمسة خيارات A–E ── */
var RING2=[0,1,3,2];
var RING3=[0,1,2,5,8,7,6,3];
var SCALES=[0.55,0.68,0.81,0.94,1.07,1.20];
var SHADE_OP=['0','0.32','1'];
var ELNAME_AR=['المربع','الدائرة','المثلث','المعيّن'];
var ELNAME_EN=['the square','the circle','the triangle','the diamond'];
var SHNAME_AR={3:'مثلث',4:'مربع',5:'خماسي',6:'سداسي'};
var SHNAME_EN={3:'a triangle',4:'a square',5:'a pentagon',6:'a hexagon'};

function elShape(sh,cx,cy,r,fill){
  var f=fill?'var(--pen)':'none',sw=1.7;
  if(sh===1)return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+f+'" stroke="var(--pen)" stroke-width="'+sw+'"/>';
  if(sh===0)return '<rect x="'+(cx-r)+'" y="'+(cy-r)+'" width="'+(2*r)+'" height="'+(2*r)+'" fill="'+f+'" stroke="var(--pen)" stroke-width="'+sw+'"/>';
  if(sh===2)return '<polygon points="'+cx+','+(cy-r)+' '+(cx+r)+','+(cy+r*0.85)+' '+(cx-r)+','+(cy+r*0.85)+'" fill="'+f+'" stroke="var(--pen)" stroke-width="'+sw+'" stroke-linejoin="round"/>';
  return '<polygon points="'+cx+','+(cy-r)+' '+(cx+r)+','+cy+' '+cx+','+(cy+r)+' '+(cx-r)+','+cy+'" fill="'+f+'" stroke="var(--pen)" stroke-width="'+sw+'" stroke-linejoin="round"/>';
}
function cellsSVG(st,size){
  var sz=size||58,pad=7,box=66-2*pad,c=box/st.n,o='',i,j;
  o+='<svg viewBox="0 0 66 66" width="'+sz+'" height="'+sz+'" xmlns="http://www.w3.org/2000/svg">';
  o+='<rect x="'+pad+'" y="'+pad+'" width="'+box+'" height="'+box+'" fill="none" stroke="var(--rule)" stroke-width="1.4"/>';
  for(i=1;i<st.n;i++){
    o+='<line x1="'+(pad+i*c)+'" y1="'+pad+'" x2="'+(pad+i*c)+'" y2="'+(pad+box)+'" stroke="var(--rule)" stroke-width="1"/>';
    o+='<line x1="'+pad+'" y1="'+(pad+i*c)+'" x2="'+(pad+box)+'" y2="'+(pad+i*c)+'" stroke="var(--rule)" stroke-width="1"/>';
  }
  var r=c*0.27;
  for(i=0;i<st.els.length;i++){
    var el=st.els[i],row=Math.floor(el.cell/st.n),col=el.cell%st.n;
    o+=elShape(el.sh,pad+col*c+c/2,pad+row*c+c/2,r,el.fill);
  }
  return o+'</svg>';
}
function polyPts(n,r){var a=[],i,ang;
  for(i=0;i<n;i++){ang=i*2*Math.PI/n;a.push((r*Math.sin(ang)).toFixed(2)+','+(-r*Math.cos(ang)).toFixed(2));}
  return a.join(' ');}
function figSVG(st,size){
  var s=size||58,sc=SCALES[st.size],r=18,m=st.mirror?-1:1,o='';
  var nx=(r*0.52*Math.sin(0.95)).toFixed(2),ny=(-r*0.52*Math.cos(0.95)).toFixed(2);
  o+='<svg viewBox="0 0 66 66" width="'+s+'" height="'+s+'" xmlns="http://www.w3.org/2000/svg">';
  o+='<g transform="translate(33,30) scale('+m+',1) rotate('+st.rot+') scale('+sc+')">';
  o+='<polygon points="'+polyPts(st.sides,r)+'" fill="var(--pen)" fill-opacity="'+SHADE_OP[st.shade]+
     '" stroke="var(--pen)" stroke-width="'+(2/sc).toFixed(2)+'" stroke-linejoin="round"/>';
  o+='<circle cx="'+nx+'" cy="'+ny+'" r="'+(3/sc).toFixed(2)+'" fill="'+(st.shade===2?'var(--card)':'var(--pen)')+'"/>';
  o+='</g>';
  for(var d=0;d<st.count;d++)o+='<circle cx="'+(7+d*7)+'" cy="62" r="2.2" fill="var(--ink)"/>';
  return o+'</svg>';
}
function drawFrame(kind,st,size){return kind==='cells'?cellsSVG(st,size):figSVG(st,size);}

function rnd(n){return Math.floor(Math.random()*n);}
function pickSome(arr,k){var a=arr.slice(),out=[],i;
  for(i=0;i<k&&a.length;i++)out.push(a.splice(rnd(a.length),1)[0]);return out;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function cellKey(st){
  if(st.els){return st.els.map(function(e){return e.cell+':'+e.sh+':'+e.fill;}).sort().join('|');}
  return st.rot+'|'+st.size+'|'+st.count+'|'+st.shade+'|'+st.sides+'|'+st.mirror;
}

function makeCells(){
  var tries=0;
  while(tries++<60){
    var n=Math.random()<0.45?2:3,ring=n===2?RING2:RING3,L=ring.length;
    var nEls=n===2?2:(Math.random()<0.5?2:3);
    var shapes=pickSome([0,1,2,3],nEls);
    var starts=pickSome(L===4?[0,1,2,3]:[0,1,2,3,4,5,6,7],nEls);
    var steps=[],i,f;
    for(i=0;i<nEls;i++)steps.push([0,1,2,L-1][rnd(4)]);
    if(steps.every(function(s){return s===0;}))continue;
    var rotFill=Math.random()<0.5?rnd(nEls):-1;
    function stateAt(f){
      var els=[];
      for(var i=0;i<nEls;i++)
        els.push({sh:shapes[i],cell:ring[(starts[i]+steps[i]*f)%L],
                  fill:rotFill<0?0:(((rotFill+f)%nEls)===i?1:0)});
      return {n:n,els:els};
    }
    var ok=true,all=[];
    for(f=0;f<6;f++){
      var st=stateAt(f),seen={};
      for(i=0;i<st.els.length;i++){
        if(seen[st.els[i].cell]){ok=false;break;}
        seen[st.els[i].cell]=1;
      }
      if(!ok)break;
      all.push(st);
    }
    if(!ok)continue;
    if(cellKey(all[0])===cellKey(all[1]))continue;
    var ar=[],en=[];
    for(i=0;i<nEls;i++){
      var k=steps[i];
      var mAr=k===0?'يبقى في مكانه':(k===L-1?'يتقدّم خانة عكس عقارب الساعة':(k===1?'يتقدّم خانة مع عقارب الساعة':'يتقدّم خانتين مع عقارب الساعة'));
      var mEn=k===0?'stays where it is':(k===L-1?'moves one cell anticlockwise':(k===1?'moves one cell clockwise':'moves two cells clockwise'));
      ar.push(ELNAME_AR[shapes[i]]+' '+mAr);
      en.push(ELNAME_EN[shapes[i]]+' '+mEn);
    }
    if(rotFill>=0){
      ar.push('والتظليل الأسود ينتقل من شكل إلى الذي يليه في كل صورة');
      en.push('the black fill passes from one element to the next in each figure');
    }
    return {kind:'cells',n:n,ring:ring,nEls:nEls,frames:all.slice(0,5),right:all[5],ar:ar,en:en};
  }
  return null;
}

function makeFigure(){
  var attrs=['rot','size','count','shade','sides','mirror'];
  var vary=pickSome(attrs,2),ar=[],en=[],rule={};
  var base={count:2+rnd(3),shade:2,rot:45*rnd(8),size:3,sides:3+rnd(4),mirror:0};
  if(vary.indexOf('rot')>-1){
    var ro=[45,90,135,225,270,315],rd=ro[rnd(ro.length)];
    if(vary.indexOf('sides')===-1&&rd%(360/base.sides)===0)base.sides=(base.sides===4?5:3);
    rule.rot=function(i){return (base.rot+rd*i)%360;};
    var deg=rd>180?360-rd:rd;
    ar.push('الشكل يدور '+deg+' درجة '+(rd>180?'عكس':'مع')+' عقارب الساعة في كل خطوة');
    en.push('the figure turns '+deg+'\u00B0 '+(rd>180?'anticlockwise':'clockwise')+' each step');
  }
  if(vary.indexOf('size')>-1){
    var zd=Math.random()<0.5?1:-1,z0=zd>0?0:5;
    rule.size=function(i){return z0+zd*i;};
    ar.push(zd>0?'وحجم الشكل يكبر درجة في كل صورة':'وحجم الشكل يصغر درجة في كل صورة');
    en.push(zd>0?'the figure grows one step larger in each figure':'the figure shrinks one step in each figure');
  }
  if(vary.indexOf('count')>-1){
    if(Math.random()<0.5){
      var cd=Math.random()<0.5?1:-1,c0=cd>0?1:6;
      rule.count=function(i){return c0+cd*i;};
      ar.push(cd>0?'وعدد النقاط يزيد واحدة في كل صورة':'وعدد النقاط ينقص واحدة في كل صورة');
      en.push(cd>0?'the dot count rises by one in each figure':'the dot count falls by one in each figure');
    } else {
      var pr=pickSome([1,2,3,4,5],2),co=rnd(2);
      rule.count=function(i){return pr[(i+co)%2];};
      ar.push('وعدد النقاط يتبادل بين '+pr[0]+' و'+pr[1]);
      en.push('the dot count alternates between '+pr[0]+' and '+pr[1]);
    }
  }
  if(vary.indexOf('shade')>-1){
    if(Math.random()<0.5){var so=rnd(2);rule.shade=function(i){return ((i+so)%2===0)?2:0;};
      ar.push('والتظليل يتبادل بين ممتلئ وفارغ');en.push('the shading alternates between filled and empty');}
    else {var s3=rnd(3);rule.shade=function(i){return (i+s3)%3;};
      ar.push('والتظليل يدور على ثلاث حالات: فارغ ثم خفيف ثم ممتلئ');
      en.push('the shading cycles through three states: empty, light, filled');}
  }
  if(vary.indexOf('sides')>-1){
    var pp=pickSome([3,4,5,6],2),po=rnd(2);
    rule.sides=function(i){return pp[(i+po)%2];};
    ar.push('والشكل يتبادل بين '+SHNAME_AR[pp[0]]+' و'+SHNAME_AR[pp[1]]);
    en.push('the figure alternates between '+SHNAME_EN[pp[0]]+' and '+SHNAME_EN[pp[1]]);
  }
  if(vary.indexOf('mirror')>-1){
    var mo=rnd(2);rule.mirror=function(i){return ((i+mo)%2===0)?0:1;};
    ar.push('والشكل ينعكس أفقيًا صورةً بعد صورة');
    en.push('the figure flips horizontally from figure to figure');
  }
  var KEYS=['count','shade','rot','size','sides','mirror'];
  function stateAt(i){var st={};KEYS.forEach(function(k){st[k]=rule[k]?rule[k](i):base[k];});return st;}
  return {kind:'figure',frames:[stateAt(0),stateAt(1),stateAt(2),stateAt(3),stateAt(4)],
          right:stateAt(5),ar:ar,en:en};
}

function perturbCells(st,ring){
  var c=JSON.parse(JSON.stringify(st)),i=rnd(c.els.length),mode=rnd(3);
  if(mode===0){
    var pos=ring.indexOf(c.els[i].cell);
    c.els[i].cell=ring[(pos+(Math.random()<0.5?1:ring.length-1))%ring.length];
  } else if(mode===1&&c.els.length>1){
    var j=(i+1)%c.els.length,tmp=c.els[i].cell;c.els[i].cell=c.els[j].cell;c.els[j].cell=tmp;
  } else {
    c.els[i].fill=1-c.els[i].fill;
  }
  var seen={};
  for(var k=0;k<c.els.length;k++){if(seen[c.els[k].cell])return null;seen[c.els[k].cell]=1;}
  return c;
}
function perturbFigure(st,a){
  var c={};['count','shade','rot','size','sides','mirror'].forEach(function(k){c[k]=st[k];});
  if(a==='count') c.count=clamp(c.count>=4?c.count-1:c.count+1,1,6);
  if(a==='shade') c.shade=(c.shade+1+rnd(2))%3;
  if(a==='rot')   c.rot=(c.rot+(Math.random()<0.5?90:270))%360;
  if(a==='size')  c.size=clamp(c.size>=3?c.size-1:c.size+1,0,5);
  if(a==='sides') c.sides=clamp(c.sides>=5?c.sides-1:c.sides+1,3,6);
  if(a==='mirror')c.mirror=1-c.mirror;
  return c;
}

function makeInductive(){
  var g=Math.random()<0.6?makeCells():makeFigure();
  if(!g)g=makeFigure();
  var opts=[g.right],seen={},guard=0,cand;
  seen[cellKey(g.right)]=1;
  if(g.kind==='cells'){
    opts.push(g.frames[4]);
    if(cellKey(g.frames[4])===cellKey(g.right))opts.pop();else seen[cellKey(g.frames[4])]=1;
    while(opts.length<5&&guard++<200){
      cand=perturbCells(opts[rnd(opts.length)],g.ring);
      if(cand&&!seen[cellKey(cand)]){seen[cellKey(cand)]=1;opts.push(cand);}
    }
  } else {
    var attrs=['rot','size','count','shade','sides','mirror'],order=pickSome(attrs,attrs.length);
    for(var i=0;i<order.length&&opts.length<5;i++){
      cand=perturbFigure(g.right,order[i]);
      if(!seen[cellKey(cand)]){seen[cellKey(cand)]=1;opts.push(cand);}
    }
    while(opts.length<5&&guard++<200){
      cand=perturbFigure(opts[rnd(opts.length)],attrs[rnd(attrs.length)]);
      if(!seen[cellKey(cand)]){seen[cellKey(cand)]=1;opts.push(cand);}
    }
  }
  var shuffled=opts.map(function(v,ix){return{v:v,r:Math.random(),correct:ix===0};})
                   .sort(function(a,b){return a.r-b.r;});
  return {kind:g.kind,frames:g.frames,opts:shuffled,
    sig:g.kind+'|'+g.frames.map(cellKey).join('/')+'>'+cellKey(g.right),
    ar:'القاعدة: '+g.ar.join('، ')+'. تتبّع كل عنصر وحده عبر الصور الخمس قبل النظر إلى الخيارات.',
    en:'The rule: '+g.en.join(', ')+'. Track each element on its own across the five figures before looking at the options.'};
}

  function shuffle(a){var r=a.slice(),i,j,t;

  function build(){
    var items=[],full=(mode!=='exam');
    if(mode==='missed'){
      items=shuffle(missedFor(sec));
      return {items:items,idx:0,ans:new Array(items.length).fill(null),
              spent:new Array(items.length).fill(0),left:0,done:false};
    }
    if(sec==='verbal'){
      var idxd=VERBAL.map(function(bk,i){return {bk:bk,i:i};});
      var pool=full?idxd:shuffle(idxd).slice(0,10);
      pool.forEach(function(o,bi){o.bk.s.forEach(function(st,si){
        items.push({type:'v',passage:o.bk.p,pIdx:bi,sig:'v'+o.i+'.'+si,stem:st.t,
          ch:["True","False","Can't Say"],a:{T:0,F:1,CS:2}[st.a],ar:st.ar,en:st.en});});});
    } else if(sec==='numerical'){
      var idxn=NUM.map(function(q,i){return {q:q,i:i};});
      var qs=full?idxn:shuffle(idxn).slice(0,17);
      items=qs.map(function(o){
        var q=o.q,order=shuffle(q.ch.map(function(c,i){return i;}));
        return {type:'n',sig:'n'+o.i,stem:q.stem,tbl:q.tbl,
          ch:order.map(function(i){return q.ch[i];}),
          a:order.indexOf(q.a),ar:q.ar,en:q.en};
      });
    } else {
      var want=full?16:24,used={},guard=0;
      while(items.length<want&&guard<800){
        guard++;
        var g=makeInductive();
        if(used[g.sig])continue;
        used[g.sig]=1;
        items.push({type:'i',sig:g.sig,kind:g.kind,frames:g.frames,opts:g.opts,ar:g.ar,en:g.en});
      }
    }
    var mins={verbal:17,numerical:18,inductive:24}[sec];
    return {items:items,idx:0,ans:new Array(items.length).fill(null),
            spent:new Array(items.length).fill(0),left:mins*60,done:false};
  }

  function qBody(it,showAns,picked,hidePassage){
    var h='';

      if(!hidePassage)h+='<div class="passage">'+it.passage+'</div>';

      if(it.tbl){h+='<div class="dtbl"><table><tbody>';
        it.tbl.forEach(function(r,ri){h+='<tr>'+r.map(function(c){
          return ri===0?'<th>'+c+'</th>':'<td>'+c+'</td>';}).join('')+'</tr>';});
        h+='</tbody></table></div>';}
      h+='<p class="stem ltr">'+it.stem+'</p>';

      h+='<div class="seqrow">';
      it.frames.forEach(function(f){h+='<span class="frame">'+drawFrame(it.kind,f,58)+'</span>';});
      h+='<span class="frame miss">?</span></div><p class="stem">'+t().seqQ+'</p>';
    }
    if(it.type==='i'){
      h+='<div class="choices grid">';
      var LET='ABCDE';
      it.opts.forEach(function(o,i){
        var cls='ch svgch';
        if(showAns){if(o.correct)cls+=' correct';else if(picked===i)cls+=' incorrect';}
        h+='<button class="'+cls+'" data-i="'+i+'" type="button" aria-label="'+LET[i]+'" aria-pressed="'+(picked===i?'true':'false')+'">'+
           '<span class="optl">'+LET[i]+'</span>'+drawFrame(it.kind,o.v,58)+'</button>';

    } else {
      h+='<div class="choices">';
      it.ch.forEach(function(c,i){

      });

  function lapse(){
    if(mode!=='exam'||!state||state.done||!state.mark)return;
    state.spent[state.idx]=(state.spent[state.idx]||0)+Math.round((Date.now()-state.mark)/1000);
    state.mark=Date.now();

  function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}

        var avg=s.items.length?Math.round(tot/s.items.length):0;

      s.items.forEach(function(it,i){

           '<div class="expl '+(ok?'good':'bad')+'"><b>'+(ok?L.good:(s.ans[i]===null?L.none:L.bad))+'</b>'+ex(it)+
           (mode==='exam'?'<div class="tspent'+((s.spent[i]||0)>Math.round({verbal:17,numerical:18,inductive:24}[sec]*60/s.items.length)*1.6?' slow':'')+'">'+L.tSpent(s.spent[i]||0,L.fmtSec)+'</div>':'')+
           '</div></div>';
      });
    }
    runner.innerHTML=h;
    if(mode==='exam'&&!s.done)s.mark=Date.now();
    wire();
  }
  function isRight(it,a){
    if(a===null)return false;
    return it.type==='i'?!!it.opts[a].correct:(a===it.a);

  function wire(){
    var s=state;
    Array.prototype.forEach.call(runner.querySelectorAll('.q'),function(qd){
      var qi=parseInt(qd.getAttribute('data-q'),10);if(isNaN(qi))return;
      Array.prototype.forEach.call(qd.querySelectorAll('.ch'),function(b){
        b.addEventListener('click',function(){

  function begin(saved){

        '<div class="navrow"><button id="backBtn" type="button">'+t().changeSec+'</button></div>';

  function syncHeader(){
    var el=document.querySelector('header.top');
    if(el)document.documentElement.style.setProperty('--hdr',el.offsetHeight+'px');
  }
  window.addEventListener('resize',syncHeader);
  window.addEventListener('orientationchange',syncHeader);
  setTimeout(syncHeader,0);setTimeout(syncHeader,400);
  try{var sl=localStorage.getItem('shl-lang');if(sl==='en'||sl==='ar')lang=sl;}catch(e){}
  document.addEventListener('keydown',function(ev){
    if(!state||state.done||runner.hidden)return;
    if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
    var opts=runner.querySelectorAll('.q .ch');
    if(ev.key>='1'&&ev.key<='4'){
      var n=parseInt(ev.key,10)-1;
      if(opts[n]){opts[n].click();ev.preventDefault();}
    } else if(ev.key==='Enter'){
      var nb=runner.querySelector('#nextBtn');
      if(nb){nb.click();ev.preventDefault();}
    }
  });
  paintChrome();
  syncHeader();
})();
</script>
</body>
</html>
